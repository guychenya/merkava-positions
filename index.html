ז-1976. \n מומחיות בתחום המחלקה/היחידה/המכון*, בהתאם לקבוע בתקנות הרופאים (אישור \n תואר מומחה ובחינות), תשל\"ג 1973. \n דרישות רצויות נוספות \n *********************** \n הכשרה: \n ------------------------ \n רצוי סיום השתלמות עמיתים (fellowship) במשרות בהן רלוונטי, בהתאם \n למומחיות הספציפית במשרה, כמפורט בתואר המשרה. \n שפות: \n ------------------------ \n ידיעת השפה העברית כדי ביטוי בכתב ובעל-פה ברמה גבוהה, וקריאת ספרות \n מקצועית. \n ידיעת שפה לועזית כדי קריאה וכתיבה של ספרות מקצועית המקובלת בארץ. \n כישורים אישיים: \n ------------------------ \n יכולת לקיים יחסי אנוש תקינים \n כושר ארגון וניהול \n יכולת לקיים בקרה ומעקב. \n שירותיות. \n הערות: \n ------------------- \n * בעת פרסום מכרז יש לציין את מקצוע היחידה בתואר המשרה. \n ** בעת פרסום מכרז חובה לציין את המומחיות הנדרשת הנגזרת מתחום היחידה*: \n בתחום האונקולוגיה - נדרשת מומחיות באונקולוגיה. \n בתחום האימונולוגיה והאלרגולוגיה- נדרשת מומחיות-על באימונולוגיה קלינית \n ואלרגולוגיה. \n בתחום האנדוקרינולוגיה-  נדרשת מומחיות-על באנדוקרינולוגיה. \n בתחום האנדוקרינולוגית ילדים - נדרשת מומחיות-על באנדוקרינולוגית ילדים. \n בתחום הגנטיקה -  נדרשת מומחיות-על בגנטיקה רפואית. \n בתחום הגסטרואנטרולוגיה - נדרשת מומחיות-על בגסטרואנטרולוגיה. \n בתחום הגסטרואנטרולוגית ילדים - נדרשת מומחיות-על בגסטרואנטרולוגית ילדים. \n בתחום הדימות והרנטגן - נדרשת מומחיות ברדיולוגיה אבחנתית. \n בתחום הגריאטריה - נדרשת מומחיות בגריאטריה או ברפואת משפחה או ברפואה \n פנימית. \n בתחום ההמטולוגיה - נדרשת מומחיות-על בהמטולוגיה. \n בתחום המטו-אונקולוגית ילדים - נדרשת מומחיות-על בהמטו-אונקולוגית ילדים. \n בתחום ההרדמה - נדרשת מומחיות בהרדמה. \n בתחום התפתחות הילד - נדרשת מומחיות-על בנוירולוגית ילדים והתפתחות הילד. \n בתחום הטיפול ביילוד -  נדרשת מומחיות-על בנאונטולוגיה. \n בתחום טיפול נמרץ ביילוד או בילדים - נדרשת מומחיות-על בטיפול נמרץ \n ילדים. \n בתחום הטיפולים הנמרצים - נדרשת מומחיות-על בטיפול נמרץ כללי. \n בתחום היילוד והגינקולוגיה - נדרשת מומחיות בילוד וגניקולוגיה. \n בתחום הריון בסיכון גבוהה- נדרשת מומחיות בילוד וגניקולוגיה. \n בתחום הילדים - נדרשת מומחיות ברפואת ילדים. \n בתחום הכאב - נדרשת מומחיות על ברפואה לשיכוך כאב, רשאים להגיש מועמדותם \n גם בעלי/ות מומחיות בהרדמה. עדיפות למומחיות בשיכוך כאב. \n בתחום הכירורגיה האורולוגית - נדרשת מומחיות בכירורגיה אורולוגית. \n בתחום הכירורגיה האורתופדית/טראומה אורתופדית –נדרשת מומחיות בכירורגיה \n אורתופדית. \n בתחום הטראומה- נדרשת מומחיות בכירורגיה כללית עם השתלמות עמיתים בטראומה. \n בתחום כירורגית כף רגל וקרסול – נדרשת מומחיות בכירורגיה אורתופדית. \n בתחום כירורגית מפרקים – נדרשת מומחיות בכירורגיה אורתופדית. \n בתחום כירורגית ילדים - נדרשת מומחיות-על בכירורגית ילדים. \n בתחום כירורגית כלי הדם - נדרשת מומחיות בכירורגית כלי דם. \n בתחום הכירורגיה הכללית - נדרשת מומחיות בכירורגיה כללית. \n בתחום הכירורגיה הקולורקטלית - נדרשת מומחיות בכירורגיה כללית עם השתלמות \n עמיתים בכירורגיה של הקולון והרקטום. \n בתחום הכירורגיה הכללית הלפרוסקופית- נדרשת מומחיות בכירורגיה כללית. \n בתחום כירורגית פה ולסת- נדרש רישיון ישראלי לעסוק ברפואת שיניים ומומחיות \n בכירורגיית פה ולסת. \n בתחום הכירורגיה הפלסטית - נדרשת מומחיות בכירורגיה פלסטית. \n בתחום הכירורגיה של בית החזה - נדרשת מומחיות בכירורגיה של בית החזה. \n בתחום הכירורגיה של היד - נדרשת מומחיות-על בכירורגיה של היד. \n בתחום כירורגית שד - נדרשת מומחיות בכירורגיה כללית. \n בתחום מחלות אף אוזן גרון וכירורגיית ראש וצוואר -  נדרשת  מומחיות במחלות \n אף אוזן גרון וכירורגיית ראש וצוואר. \n בתחום המחלות הזיהומיות - נדרשת מומחיות-על במחלות זיהומיות. \n והמתבגר. \n בתחום קרדיולוגית ילדים -  נדרשת מומחיות-על בקרדיולוגית ילדים. \n בתחום הרפואה הגרעינית/איזוטופים - נדרשת מומחיות ברפואה גרעינית. \n בתחום רפואת הפה ובתחום רפואת הפה בסיכון גבוה- נדרש רישיון ישראלי לעסוק \n ברפואת שיניים ומומחיות ברפואת הפה. \n בתחום רפואת הפה לילדים- נדרש רישיון ישראלי לעסוק ברפואת שיניים ומומחיות \n ברפואת שיניים לילדים. \n בתחום השיקום - נדרשת מומחיות ברפואה פיסיקלית ושיקום. \n מועמדותם רופאים בעלי מומחיות בכל אחד מתחומים אלה, ובלבד שלהם ניסיון \n בתחום מחלות ריאה - נדרשת מומחיות-על במחלות ריאה. \n בתחום מחלות ריאה ילדים - נדרשת מומחיות-על במחלות ריאה ילדים. \n בתחום מחלות ריאה ושחפת- נדרשת מומחיות על במחלות ריאה או מומחיות על \n במחלות זיהומיות או מומחיות ברפואה פנימית. \n בתחום הנוירוכירורגיה - נדרשת מומחיות בנוירוכירורגיה. \n בתחום הנוירולוגיה - נדרשת מומחיות בנוירולוגיה. \n בתחום נוירולוגית ילדים - נדרשת מומחיות-על בנוירולוגית ילדים והתפתחות \n הילד. \n בתחום הנפרולוגיה - נדרשת מומחיות-על בנפרולוגיה. \n בתחום נפרולוגית ילדים - נדרשת מומחיות-על בנפרולוגית ילדים. \n בתחום הפוריות - נדרשת מומחיות ביילוד וגניקולוגיה. \n בתחום הפסיכיאטריה - נדרשת מומחיות בפסיכיאטריה. \n בתחום פסיכיאטרית הילדים והנוער - נדרשת מומחיות בפסיכיאטריה של הילד \n בתחום הפרמקולוגיה - נדרשת מומחיות-על בפרמקולוגיה קלינית. \n בתחום הפתולוגיה - נדרש מומחיות באנטומיה פתולוגית. \n בתחום הקרדיולוגי/ לב - נדרשת מומחיות-על בקרדיולוגיה. \n בתחום הרפואה הדחופה - נדרשת מומחיות באחד ממקצועות הרפואה הקליניים, \n עדיפות למומחיות על ברפואה דחופה. \n ברפואה דחופה ילדים. \n בתחום הרפואה הדחופה לנשים - נדרשת מומחיות בילוד וגניקולוגיה. \n בתחום הרפואה הפנימית - נדרשת מומחיות ברפואה פנימית. \n *ביחידות שתחומי ההתמחות בהן משלבים למעלה מתחום מומחיות אחד, רשאים להגיש \n בתחום מחלות עור ומין - נדרש ת מומחיות במחלות עור ומין. \n בתחום מחלות עיניים - נדרשת מומחיות במחלות עיניים. \n בתחום מניעת זיהומים - נדרשת מומחיות על במחלות זיהומיות. \n בתחום צינתורי המוח – נדרשת מומחיות בנוירולוגיה, או רדיולוגיה, או \n נוירוכירורגיה או קרדיולוגיה ובנוסף נדרשת השתלמות עמיתים מוכרת בתחום \n צינתורי מוח. \n בתחום הריאומטולוגיה- נדרשת מומחיות-על בריאומטולוגיה. \n בתחום הרפואה הדחופה לילדים -דרשת מומחיות ברפואת ילדים ומומחיות על \n בתחום היחידה.","unit":"יחידה מקצועית לטיפול נמרץ ילדים - רופאים","ministry":"בית חולים הלל יפה חדרה","description":"עיסוק באחד או יותר ממקצועות הרפואה, במסגרת המרכז הרפואי, בהתאם להכשרה \n המקצועית, לחוקים ולתקנות ובכפיפות לממונה. \n  \n לימוד, הכוונה, הדרכה הכשרה ופיקוח על הרופאים הזוטרים במחלקה, סטודנטים \n וסטאז'רים לרבות פתרון בעיות מקצועיות  המתעוררות, בהתאם לצורך. \n  \n ביצוע אבחונים ו/או טיפולים לחולים המאושפזים והאמבולטוריים, בהתאם לסדרי \n העבודה במחלקה, תוך דיווח לממונה במקרים חריגים ובכפוף לחוק זכויות החולה. \n  \n סיוע לממונה באחריות על בטיחות הטיפול, המטופל והמטופלים במחלקה, לרבות \n השתתפות בתחקור של מקרים ותרחישים חריגים במהלך הפעילות השוטפת במחלקה. \n  \n מתן יעוץ מקצועי בתחום המומחיות לגורמים שונים במרכז הרפואי. \n  \n ייזום והוצאה אל הפועל של תכניות הדרכה והשתלמויות לצוות המחלקה ובמרכז \n הרפואי בתחום המומחיות. \n  \n איסוף חומר סטטיסטי הדרוש למחקרים, השתתפות בהוראה ובמחקרים במקומות \n המסונפים למוסדות אקדמיים. \n  \n השתלבות במערך הכוננויות והתורנויות של המרכז הרפואי בהתאם לתכנית הנקבעת \n על- ידי הממונה. \n  \n התעדכנות שוטפת בהתפתחויות מדעיות בתחום, כפי שבאות לביטוי בספרות \n המקצועית, לשם יישומן בעבודה. \n  \n מסירת מידע רפואי הקשור לחולה, לממונה ולכל גורם המוסמך לקבלו לפי החוק \n וע\"פ הנהלים המאושרים. \n  \n ניהול רישום על מחלות המחייבות דיווח בהתאם לחוק והעברתו לממונה. \n  \n השתתפות בפעילות הקשורה בשעת חירום. \n  \n ביצוע תפקידים נוספים, בתחום המקצועי, בהתאם להנחיות הממונה. \n  \n פירוט מטלות נוספות לרופא/ה מומחה/ית בהרדמה: \n ------------------------------------------------- \n השתתפות בביצוע פעולות הרדמה בחדרי הניתוח וביתר מחלקות בית החולים, בהתאם \n לצורך ולהוראות הממונה. \n  \n ביצוע פעולות פולשניות, בהתאם להוראות, לתקנות ולהרשאות הפעולה, \n לרבות  אינטובציה, החדרת ליינים והכנסת זונדה לקיבה. \n  \n השתתפות בצוות ההחייאה ובצוות טראומה, במידת הצורך ובהתאם להנחיות הממונה. \n  \n אחריות להדרכת והכשרת מתמחים, סטודנטים וסטאז'רים, לרבות ביצוע בקרה אחר \n בדיקות טרום ניתוחיות, תכניות הרדמה, תורנויות וכד'.","rank":"4-6","cluster":"","category":"בריאות","request_id":"07701083","days_left":"4"},{"remarks":"מכרז זה נועד להקמת מאגר מועמדים לתפקיד מוביל/ת מערך הטיפול \n במעונות רשות חסות הנוער, בפריסה ארצית. מועמדים שיעברו בהצלחה \n את שלבי המיון הנדרשים ייכללו במאגר המועמדים. \n  \n הקבלה למאגר אינה מהווה קבלה לעבודה או התחייבות לשיבוץ במשרה בפועל. \n הליך הגיוס למאגר בנוי ממספר שלבים, שנועדו לבחון את התאמת המועמדים לתפקיד. \n מומלץ להכיר מראש את שלבי ההליך ולהיערך אליהם באמצעות אתר המידע הייעודי. \n  \n ל ת) ו/או ברא\"ם ובלבד שעסק בתחום \n הטכנולוגי בכפוף לאישור מתאים. \n *בשלב זה, ההסמכות טרם נכנסו לתוקף ועל כן לא תידרשנה. החל ממועד כניסת \n ההסמכות לתוקף, דרישה זו תהיה תנאי השכלה יחיד. \n ניסיון: \n ******* \n ניסיון בביצוע מטלות המתוארות בתיאור התפקיד, לרבות: \n 1.   ניסיון מקצועי בתשתיות טכנולוגיות ברכיבי ואמצעי הגנה (לרבות ניהול \n      ותחזוקת רשת תקשורת מחשבים, מערכי אחסון, מערכי הגנה ומערכות הפעלה). \n 2.   ניסיון מקצועי בתכנון מענה טכנולוגי תשתיתי וארכיטקטורה להגנת סייבר \n      בארגון. \n 3.   ניסיון מקצועי במוצרי הגנה (משפחות מוצרים, השוואה בין מוצרים, \n      משמעויות כתוצאה מהטמעת המוצרים). \n 4.   ניסיון והיכרות בתשתיות ושיטות הצפנה (מפתחות הצפנה,ניהול אישורים). \n 5.   ניסיון מקצועי בתהליכי האבטחה השגרתיים בארגון. \n 6.   ניסיון מקצועי בטיפול באירועי סייבר בהיבט הטכנולוגי. \n הניסיון האמור לעיל, בהתאם לפירוט הבא: \n לבעלי תואר ראשון - 5 שנות ניסיון \n לבעלי תואר שני - 4 שנות ניסיון \n להנדסאים- 6 שנות ניסיון \n לטכנאים- 7 שנות ניסיון \n רצוי: \n **** \n היכרות בסיסית של שיטות ותהליכים לפיתוח קוד מאובטח (Secure conding) \n היכרות עם תקינה הטכנולוגית להגנה. \n היכרות בסיסית ומושגים בתהליכי Forensics \n ידיעת השפה האנגלית כדי קריאת חומר מקצועי בתחום ההגנה \n היכרות עם תחום התקשוב הממשלתי/ציבורי","unit":"אגף בכיר (טכנולוגיות דיגטליות ומידע)","ministry":"משרד ראש ממשלה","description":"אחריות לתכנון, יישום, הטמעה, תחזוקה, פיקוח ובקרה על מימוש מענה תשתיתי \n טכנולוגי \n  \n אחריות על תכנון ארכיטקטורת רשת מאובטחת התואמת לצרכים הארגוניים וכמענה \n לאיומים הנשקפים ממרחב הסייבר. \n  \n אחריות על התאמת מוצרי הגנה ושילובם בתשתיות המחשוב, לרבות מערכי אחסון \n ושיטות גיבוי להתאוששות מפגיעה. \n  \n אחריות על כתיבת מסמכי הקשחה והגנה למרכיבי הרשת (מערכות הפעלה, בסיסי \n נתונים, רשת תקשורת, אפליקציות, מסדי אחסון, עמדות הקצה, הצפנה ועוד). \n  \n אחריות על תכנון מערכות ניטור, פיקוח והתראה ביטחונית כמענה לצרכי מרכז \n הניטור. \n  \n אחריות על ליווי הטיפול באירועי סייבר בהיבט הטכנולוגי והתהליכי. \n  \n אחריות על ביצוע רכש מוצרי הגנת הסייבר. \n  \n אחריות לניהול צוות אבטחת המ  גם הנדסאים וטכנאים מוסמכים הרשומים בפנקס ההנדסאים/טכנאים, \n למשרות בדרוג אקדמאים, במדעי החברה והרוח בהם נקבעה דרישה להשכלה אקדמית \n כללית. \n הנדסאים וטכנאים מוסמכים ידרשו להציג ניסיון לפי הפירוט להלן: \n להנדסאים מוסמכים - 5 שנות ניסיון כמפורט לעיל. \n לטכנאים מוסמכים - 6 שנות ניסיון כמפורט לעיל. \n ב. בעל תעודת הנדסאי או טכנאי מוסמך אשר ייבחר למשרה ידורג בדירוג המנהלי. \n עובד/ת מתוך שירות המדינה אשר דורג/ה זה מכבר בדירוג ההנדסאים או הטכנאים \n רשאי לשמר את דירוגו המקצועי. \n ג. השלמת רישום בפנקס ההנדסאים והטכנאים עד 48 שעות טרם כינוס ועדת \n הבוחנים: \n יש להמציא אישור על רישום בפנקס ההנדסאים והטכנאים מטעם האגף לאסדרת \n עיסוקים במשרד העבודה עד 48 שעות טרם כינוס ועדת הבוחנים ככל שלא ימצא \n האישור כאמור תפסל המועמדות. \n  \n * בהתאם להנחיית נציב שירות המדינה מס' 1.19 מיום ט\"ז בשבט התשפ\"ג (07 \n בפברואר 2023), בדבר מענה לעובדי מדינה ותיקים בהתמודדות במכרזים בדירוג \n המח\"ר, עובדי מדינה שאינם בעלי השכלה אקדמית יוכלו להתמודד במכרז פנימי או \n בינמשרדי למשרה זו, ככל שעומדים בתנאים המצטברים הבאים (סעיף 5 ג. להנחיה): \n 1.בעל/ת 12 שנות לימוד לפחות. \n 2.בעל/ת ותק של 20 שנים לפחות ברצף בשירות בעת הגשת המועמדות וכל עוד הנחיה \n זו בתוקף. \n 3.העובד/ת בעל/ת אופק שירות של לא יותר מחמש עשרה שנים עד מועד גיל פרישת \n חובה לגמלאות משירות המדינה על-פי חוק גיל פרישה, התשס\"ד- 2004. \n 4.עובדים בעלי ניסיון מקצועי כמפורט מעלה, נדרשים למספר שנות ניסיון כפול \n מהנדרש לדרגה התחילית המקבילה בדירוג המנהלי במשרה זו, כמפורט בסעיף 11.131 \n נסמן(ג)בתקשי\"ר (טבלה: פנימי ובין -משרדי), בהתאם לפירוט הבא: \n (א) למשרה במתח דרגות 36-38 בדירוג המח\"ר נדרשות 4 שנות ניסיון מקצועי. \n (ב) למשרה במתח דרגות 37-39 בדירוג המח\"ר נדרשות 6 שנות ניסיון מקצועי. \n (ג) למשרה במתח דרגות 38-40 בדירוג המח\"ר נדרשות 10 שנות ניסיון מקצועי. \n (ד) למשרה במתח דרגות 39-41 בדירוג המח\"ר נדרשות 12 שנות ניסיון מקצועי. \n (ה) למשרה במתח דרגות 40-42 בדירוג המח\"ר נדרשות 16 שנות ניסיון מקצועי. \n 5. עמידה ביתר דרישות הסף של המשרה. \n 6.עובדים בעלי ציון 5 ומעלה בהערכת עובד בשנתיים מתוך שלוש השנים \n האחרונות. \n 7 ור שלהלן: \n https://www.gov.il/BlobFolder/policy/recruitmentverification/he/recruitm \n entinformationverificationprocedure.pdf \n -הניסיון יכול להיות חופף או מצטבר. \n כישורים נוספים רצויים: \n ----------------------------- \n רצוי ניסיון מקצועי בתחום אכיפה על העסקת עובדים זרים ומעסיקיהם. \n ידע של החוקים, התקנות, וההוראות הרלוונטיות בתחומי התפקיד \n אוריינטציה דיגיטלית \n כושר מנהיגות והנעת עובדים \n יכולת ניתוח לקבלת החלטות ולעבודה בתנאי לחץ \n יכולת למידה עצמאית \n כושר ביטוי ויכולות תקשורתיות ברמה גבוהה \n כושר ניהול משא ומתן מול גורמי חוץ ופנים \n ידיעת השפה האנגלית \n יכולת ייצוג בפורומים שונים \n הערות: \n ------------------------------------------------- \n (*) זכאות לתואר אקדמי המוכר ע\"י המועצה להשכלה גבוהה, לרבות אישור על \n שקילות לתואר ממשרד החינוך. \n 1. .*א. בהתאם לסעיף 39 לחוק ההנדסאים והטכנאים המוסמכים, התשע\"ג-2012, \n רשאים להגיש מועמדותם גם הנדסאים וטכנאים מוסמכים הרשומים בפנקס \n הנדסאים/טכנאים, למשרות בדרוג אקדמאים במדעי החברה והרוח בהם נקבעה דרישה \n להשכלה אקדמית כללית. \n הנדסאים וטכנאים מוסמכים ידרשו להציג ניסיון לפי הפירוט להלן: \n להנדסאים מוסמכים - 7 שנות ניסיון כמפורט לעיל. \n לטכנאים מוסמכים - 8 שנות ניסיון כמפורט לעיל. \n ב. בעל תעודת הנדסאי או טכנאי מוסמך אשר ייבחר למשרה ידורג בדירוג המנהלי. \n עובד/ת מתוך שירות המדינה אשר דורג/ה זה מכבר בדירוג ההנדסאים או הטכנאים \n רשאי לשמר את דירוגו המקצועי. \n ג. השלמת רישום בפנקס ההנדסאים והטכנאים עד 48 שעות טרם כינוס ועדת \n הבוחנים: \n יש להמציא אישור על רישום בפנקס ההנדסאים והטכנאים מטעם האגף לאסדרת \n עיסוקים במשרד העבודה עד 48 שעות טרם כינוס ועדת הבוחנים ככל שלא ימצא \n אישור כאמור תפסל המועמדות. \n 2. מסמך זה מנוסח בלשון זכר על פי כללי השפה ופונה לכלל המינים. \n 3. קצובת כהונה - \n קציבת כהונה \n בהמשך להחלטות הממשלה מספר 3993 מיום 18.12.2011 ומספר 481 מיום 30.06.2013 \n בנושא שיפור מנגנוני ניהול ההון האנושי בשירות המדינה, ובהתאם להחלטה מס' \n 2464 מיום 08.03.2015 בנושא \"השלמת הסדרי רוטציה ותקופות כהונה בסגל הבכיר \n המוביל של שירות המדינה\" (להלן: \"החלטת הממשלה\"), משרת זו נמנית עם רשימת \n המשרות בסגל הבכיר המוביל שעליהן יחולו מנגנוני הניהול ותנאי ההעסקה, כאמור \n בהחלטת הממשלה ובהנחיית נציב שירות המדינה מספר 1.6 (מהדורה מס' 1) מיום \n 28.06.2015, בדבר הפעלת מנגנוני רוטציה וקדנציות לסגל הבכיר לפי החלטת \n הממשלה, כפי שתתעדכן מעת לעת (להלן: \"הנחיית הנציב\"). רצ\"ב קישור להנחיה: \n www.gov.il/BlobFolder/policy/guide_line_16/he/GuideLine16.pdf \n בהתאם להחלטת הממשלה וכמפורט בהנחיית הנציב, המינוי למשרה הוא לתקופת כהונה \n של שש שנים (להלן: \"תקופת כהונה תקנית\"), שניתן יהיה להאריכה לתקופה של \n שנתיים נוספות בכפוף לאמור בהחלטת הממשלה. החל מהשנה הרביעית במשרה ניתן \n יהיה להתמודד למשרה אחרת בסגל הבכיר המוביל בהתאם לנוהל האצת הסדר התמודדות \n מיוחד, עידוד מעבר בין תפקידים ומוביליות בסגל הבכיר המוביל במשרדי הממשלה \n ויחידות הסמך מיום 25.08.2024 שפרסם מנהל מינהל הסגל הבכיר או במסגרת הסדר \n התמודדות מיוחד שפורסם בהנחיית הנציב מספר 1.6 (מהדורה מס' 7) מיום \n 29.06.2023. \n מי שהשלים שמונה שנות כהונה במשרה ולא התמנה למשרה אחרת כאמור לעיל, יחולו \n עליו מנגנוני הטיפול בחריגים וסיום ההעסקה בתום כהונה, כמפורט בהנחיית \n הנציב. \n עובד שהעסקתו בשירות המדינה תסתיים בשל השלמת תקופת הכהונה התקנית כאמור \n בהחלטת הממשלה, ומתקיימים בו התנאים שקבעה הממשלה לעניין זה, יחולו עליו \n תנאי סיום ההעסקה בהתאם להחלטת הממשלה, כמפורט בנספח להחלטת הממשלה.","unit":"אגף בכיר מקלט","ministry":"רשות האוכלוסין וההגירה","description":"אחריות על ניהול מכלול פעילות אגף בכיר מקלט ושותפות בהתוויית מדיניות \n מינהל אכיפה וזרים בתחום מבקשי המקלט והמסתננים ובכלל זה, ניהול פעילות \n חוקרי ומתשאלי המסתננים ומבקשי המקלט במסגרת אמנת הפליטים-1951. \n  \n אחריות לביצוע פעילויות הנוגעות לאזרחים זרים בתחום עיסוק המשרה ומכוח חוק \n הכניסה לישראל תשי\"ב-1952, חוק למניעת הסתננות (עבירות ושיפוט), \n תשי\"ד-1954, חוק עובדים זרים תשנ\"א-1991, חוק שירות תעסוקה תשי\"ט-1959, חוק \n העסקת עובדים על ידי קבלני כח אדם תשנ\"ו-1996 וחוק העבירות המינהליות \n תשמ\"ו-1985. \n  \n גיבוש וביצוע תכנית משולבת ומתואמת עבור אגף בכיר מקלט בהתאם להחלטות ממשלה \n המתייחסות לתחום עיסוק המשרה. \n  \n אחריות על ניהול מרכז אכיפה ארצי לטיפול ברישיונות שהייה למבקשי מקלט \n ומסתננים. ביצוע מעקב ובקרה על עבודת המרכז הארצי לרבות תשאול ותחקור \n אזרחים זרים, מתן תמיכה מקצועית ואופרטיבית לשדרה הניהולית במרכז הארצי, \n קביעת נהלי עבודה והטמעתם. \n  \n יישום מדיניות מינהל אכיפה וזרים בכל הנוגע לביצוע ראיונות לזרים לרבות \n תיאום והסדרת תורים יעילה לראיונות אלו תוך הבטחת זמינות ונגישות מיטבית, \n יישום וביצוע מדיניות המינהל בכל הנוגע לטיפול במסתננים ומבקשי מקלט לרבות \n תהליכי מתן והארכת רישיונות שהייה בהתאם לנהלים ולחקיקה הרלוונטית. \n  \n הובלה וקידום רפורמות מקיפות בשירות למבקשי המקלט תוך פיתוח מתודולוגיות \n לטיפול יעיל ומקצועי בבקשות, יצירת סטנדרטים אחידים לתהליך הטיפול והטמעת \n שיטות עבודה מתקדמות. \n  \n תיאום, ריכוז וסנכרון פעילות מרכז אכיפה ארצי להארכת רישיונות למבקשי מקלט \n ומסתננים, האגף לבחינת בקשות מקלט והוועדה המייעצת לשר הפנים בענייני \n פליטים. \n  \n גיבוש יעדי האגף, קביעת תכניות עבודה שנתיות ורב-שנתיות עדכון נהלי עבודה \n פנימיים וחיצוניים וכן אחריות על יישומם בתיאום עם ראש המינהל ו/או סגנו. \n  \n ניתוח דוחות נתונים בנושא תחקור ותשאולי עומק של זרים ומסתננים, מיפוי \n וזיהוי מגמות ,תופעות רוחביות או חריגות וביצוע התאמות ו/או שינויים נדרשים \n בתהליכי העבודה בהתאם לממצאים. \n  \n גיבוש סקירות מקצועיות, חוות דעת והמלצות לראש המינהל ו/או סגנו בהתאם \n לדרישה ולצרכי קבלת החלטות ברמה הניהולית. \n  \n אחריות ויוזמה בנושאי מחקר, פיתוח מקצועי והכרת פעילות יחידות תואמות \n במדינות זרות, יישום וביצוע הפקת לקחים בפועל לרבות קידום תיקוני חקיקה, \n שינוי התאמה ועדכון בנהלי עבודה והטמעת אמצעים טכנולוגיים מתקדמים לשיפור \n והתייעלות עבודת האגף. \n  \n הבטחת תיאום ושיתוף פעולה מקצועי של עובדי האגף עם אגפים מקבילים במינהל, \n תוך יצירת סינרגיה ארגונית ומיצוי משאבים. \n  \n מתן מענה מקצועי לגופים חוץ אירגוניים כגון: משטרת ישראל, שירות בתי הסוהר, \n גופי אכיפה נוספים ורשויות בטחון לאורך כל שעות היממה בתחום האחריות. \n  \n אחריות על גיבוש ויישום תכנית הכשרה והדרכה מקיפה לעובדי האגף בתחומי \n העיסוק השונים, תוך הטמעת ידע מקצועי ועדכון שוטף בשינויים נורמטיביים \n ותפעוליים בתיאום עם מטה המינהל. \n  \n אחריות של ניהול עובדי האגף המונה כ-70 עובדים. \n  \n ייצוג המשרד בוועדות מקצועיות ובפורמים פנימיים, חיצוניים ובינלאומיים \n כגון: או\"ם, גורמי ביטחון, כנסת, משרדי ממשלה וגופים נוספים בתחום האחריות. \n  \n ביצוע פעולות נוספות בהתאם לצורכי העבודה ולדרישת הממונה.","rank":"42-44","cluster":"תפקידים בתחומים מנהלי ו/או חברתי/מילולי","category":"בקרה, פיקוח ואכיפה","request_id":"07696677","days_left":"4"},{"remarks":"מסמך זה כתוב בלשון סתמית על פי כללי השפה העברית ופונה לנשים וגברים כאחד. \n  \n בעלי השכלה אקדמית מחו\"ל נדרשים לצרף אישור שקילת תואר ממשרד החינוך. \n במקרים בהם המועמד אינו מחזיק באישור זה, יש \n לפנות למשרד החינוך בבקשה לקבלת שקילות וזאת באמצעות הקישור הבא: \n https://students.education.gov.il/towards-academic-studies/academic-degrees-eval \n במסגרת הבקשה יש לצרף את הבקשה להשלמת האישור המדובר כפי שמופק \n ממערכת הגיוס וזאת בנוסף למסמכים הנדרשים על ידי משרד החינוך. \n *עולים שהגיעו ארצה לאחר 1/1/2025 נדרשים להמציא אישור לשקילת תארים ממשרד \n  העלייה והקליטה באמצעות פניה באזור האישי. \n  \n  השלמת אישור על רישום בפנקס המהנדסים והאדריכלים עד 48 שעות \n טרם כינוס ועדת הבוחנים: יש להמציא אישור על רישום בפנקס המהנדסים \n והאדריכלים מטעם האגף לאסדרת עיסוקים במשרד העבודה עד 48 שעות טרם \n כינוס ועדת הבוחנים. ככל שלא ימצא האישור כאמור תפסל המועמדות. \n  \n  \n א.בהתאם לסעיף 39 לחוק ההנדסאים והטכנאים המוסמכים, התשע\"ג-2012, \n רשאים להגיש מועמדותם גם הנדסאים וטכנאים מוסמכים הרשומים בפנקס ההנדסאים/טכנאים, \n  למשרות בדרוג אקדמאים, במדעי החברה והרוח בהם נקבעה דרישה להשכלה אקדמית כללית. \n הנדסאים וטכנאים מוסמכים ידרשו להציג ניסיון לפי הפירוט להלן: \n להנדסאים מוסמכים - 4 שנות ניסיון כמפורט לעיל. \n לטכנאים מוסמכים - 5 שנות ניסיון כמפורט לעיל. \n  \n ב.בעל תעודת הנדסאי או טכנאי מוסמך אשר ייבחר למשרה ידורג בדירוג המנהלי. \n עובד/ת מתוך שירות המדינה אשר דורג/ה זה מכבר בדירוג ההנדסאים או \n הטכנאים רשאי לשמר את דירוגו המקצועי. \n  \n ג.השלמת רישום בפנקס ההנדסאים והטכנאים עד 48 שעות טרם כינוס ועדת הבוחנים: \n יש להמציא אישור על רישום בפנקס ההנדסאים והטכנאים מטעם האגף לאסדרת \n עיסוקים במשרד העבודה עד 48 שעות טרם כינוס ועדת הבוחנים ככל שלא ימצא \n האישור כאמור תפסל המועמדות. \n  \n שלבים ומועדים חשובים בתהליך המיון: \n א.מבחני המיון במכון מיון חיצוני יתבצעו במהלך חודש נובמבר \n 2026. \n וועדות בוחנים לתפקידים השונים יערכו במהלך  חודש דצמבר 2026 \n ב.לא ניתן יהיה לבצע מבחנים במועד אחר (אלא במקרים שהוגדרו בנהלי התקשי\"ר). \n ג.לוחות הזמנים המצוינים אינם מהווים חוזה מחייב וישתנו בהתאם להחלטת המינהל \n כל מקום בו מפורט תאור התפקיד בלשון זכר,הכוונה גם ללשון נקבה וכן להפך \n מועמדים למשרה זו עשויים להיבחן במבחני כישורים כלליים והתנהגותיים. \n ראה/י הסברים והנחיות למועמדים שייבחנו . \n גיליונות הערכה ומשוב של עובד המדינה יתקבלו כמסמכים דיגיטליים שיוצגו \n מתוך תיק העובד.עובד מדינה שתיק העובד אינו מנוהל במרכבה יצרף לבקשה \n גיליונות הערכה ומשוב מהשנתיים האחרונות. \n במידה שלא בוצעו הערכות עובד יש לצרף אישור על כך מאגף משאבי אנוש במשרד.","title":"ממונה (ליווי ועדות)","publish_type":"מכרז פומבי","hot":false,"tender_number":"144186","job_number":"1","location":"ירושלים","pub_date":"2026-09-09","submission_deadline":"2026-10-07","percent":"100.00","dedicated":"","position":"ממונה (ליווי ועדות)","requirements":"דרישות סף: \n ********************* \n השכלה: \n ----- \n השכלה אקדמית כללית. \n זכאות לתואר אקדמי המוכר ע\"י המועצה להשכלה גבוהה, לרבות אישור על \n שקילות לתואר זר ממשרד החינוך. \n לאדריכלים ומהנדסים- רישום בפנקס המהנדסים והאדריכלים. \n להנדסאים/טכנאים : רישום בפנקס ההנדסאים והטכנאים. \n ניסיון: \n ------- \n לבעלי תואר ראשון: 3 שנות ניסיון בתחום התכנון והבנייה או הדרכה והובלת \n תהליכים בתחום התכנון והבנייה. \n לבעלי תואר שני: 2 שנות ניסיון בתחום התכנון והבנייה או הדרכה והובלת \n תהליכים \n בתחום התכנון והבנייה. \n כישורים ונתונים נוספים: \n ------------------------------------- \n הכרת תחום הרישוי והבניה. \n הכרת העבודה בועדות מקומיות. \n הכרת חוק התכנון והבניה. \n יכולת ארגונית וביצועית טובה. \n ראיה מערכתית אינטגרטיבית. \n יכולות הנעה תהליכים חדשים. \n כושר ביטוי בכתב ובע\"פ ברמה גבוהה. \n שליטה בתוכנות Office, Arc GIS. \n הערות: ":"07696456","days_left":"4"},{"remarks":"מסמך זה כתוב בלשון סתמית על פי כללי השפה העברית ופונה לנשים וגברים כאחד. \n  \n בעלי השכלה אקדמית מחו\"ל נדרשים לצרף אישור שקילת תואר ממשרד החינוך. \n במקרים בהם המועמד אינו מחזיק באישור זה, יש \n לפנות למשרד החינוך בבקשה לקבלת שקילות וזאת באמצעות הקישור הבא: \n https://students.education.gov.il/towards-academic-studies/academic-degrees-eval \n במסגרת הבקשה יש לצרף את הבקשה להשלמת האישור המדובר כפי שמופק \n ממערכת הגיוס וזאת בנוסף למסמכים הנדרשים על ידי משרד החינוך. \n *עולים שהגיעו ארצה לאחר 1/1/2025 נדרשים להמציא אישור לשקילת תארים ממשרד \n  העלייה והקליטה באמצעות פניה באזור האישי. \n  \n   השלמת רישום בפנקס ההנדסאים והטכנאים עד 48 שעות טרם כינוס ועדת הבוחנים: \n  יש להמציא אישור על רישום בפנקס ההנדסאים והטכנאים מטעם האגף לאסדרת \n  עיסוקים במשרד העבודה עד 48 שעות טרם כינוס ועדת הבוחנים. \n  ככל שלא ימצא האישור כאמור תפסל המועמדות. \n  \n  השלמת אישור על רישום בפנקס המהנדסים והאדריכלים עד 48 שעות \n טרם כינוס ועדת הבוחנים: יש להמציא אישור על רישום בפנקס המהנדסים \n והאדריכלים מטעם האגף לאסדרת עיסוקים במשרד העבודה עד 48 שעות טרם \n כינוס ועדת הבוחנים. ככל שלא ימצא האישור כאמור תפסל המועמדות. \n  \n משרה זו מזכה במענק גיוס, פרטים נוספים בקישור: https://go.gov.il/grant-info \n  \n משרה זו משויכת למסלול קידום מקצועי בכפוף לתנאים מצטברים המפורטים במסלול \n הקידום. \n עובד אשר ישתבץ במשרה יהיה רשאי להתקדם במסלול בהתאם לתנאים המוגדרים בו. \n בעל תעודת הנדסאי או טכנאי מוסמך אשר ייבחר למשרה ידורג בדירוג המנהלי. \n עובד/ת מתוך שירות המדינה אשר דורג/ה זה מכבר בדירוג ההנדסאים או הטכנאים \n רשאי/ת לשמר את דירוגו/ה המקצועי. \n  \n   *להלן פירוט התארים השניים בתכנון ערים ואזורים אשר עומדים בדרישת ההשכלה במכרז ז \n 1.הטכניון–מכון טכנולוגי לישראל: תואר מגיסטר במסלול לתכנון ערים ואזורים. \n 2.האוניברסיטה העברית בירושלים: מוסמך בגיאוגרפיה ותכנון עירוני ואזורי, או מוסמך \n בגיאוגרפיה תכנון וסביבה עם התמחות בתכנון עירוני ואזורי, או מוסמך בתכנון ומדיניות \n סביבתית (החל מ- 2024), או מוסמך בחוג אחר עם התמחות בתכנון עירוני ואזורי, או מוסמ \n  בגיאוגרפיה עם התמחות בלימודים עירוניים ואזוריים (סטודנטים שהחלו לימודיהם עד שנת \n  הלימודים 2009/10). לא יכללו בפנקס בעלי תואר מוסמך עם התמחות בלימודים עירוניים \n  ואזוריים שהחלו את לימודיהם משנת 2010/11 ואילך. \n 3.אוניברסיטת בן גוריון בנגב: מוסמך בגאוגרפיה ופיתוח סביבתי במגמת תכנון עיר ואזור \n 4.אוניברסיטת תל אביב: גיאוגרפיה וסביבת האדם ובית ספר לאדריכלות, התמחות במסלול \n תכנון ועיצוב עירוני-אזורי. \n 5.אוניברסיטת בר אילן: המחלקה לגיאוגרפיה וסביבה, המגמה לתכנון עירוני. \n ההכרה היא עד אוגוסט 2026, לאחר מכן תשוב התכנית ותבחן לקבלת הכרה קבועה. \n  \n שלבים ומועדים חשובים בתהליך המיון: \n א.מבחני המיון במכון מיון חיצוני יתבצעו במהלך חודש נובמבר \n 2026. \n וועדות בוחנים לתפקידים השונים יערכו במהלך  חודש דצמבר 2026 \n ב.לא ניתן יהיה לבצע מבחנים במועד אחר (אלא במקרים שהוגדרו בנהלי התקשי\"ר). \n ג.לוחות הזמנים המצוינים אינם מהווים חוזה מחייב וישתנו בהתאם להחלטת המינהל \n  \n  \n כל מקום בו מפורט תאור התפקיד בלשון זכר,הכוונה גם ללשון נקבה וכן להפך \n מועמדים למשרה זו עשויים להיבחן במבחני כישורים כלליים והתנהגותיים. \n ראה/י הסברים והנחיות למועמדים שייבחנו . \n גיליונות הערכה ומשוב של עובד המדינה יתקבלו כמסמכים דיגיטליים שיוצגו \n מתוך תיק העובד.עובד מדינה שתיק העובד אינו מנוהל במרכבה יצרף לבקשה \n גיליונות הערכה ומשוב מהשנתיים האחרונות. \n במידה שלא בוצעו הערכות עובד יש לצרף אישור על כך מאגף משאבי אנוש במשרד.","title":"מקדם/ת תכנון ובקרה","publish_type":"מכרז פומבי","hot":false,"tender_number":"144189","job_number":"1","location":"בית אל","pub_date":"2026-09-09","submission_deadline":"2026-10-07","percent":"100.00","dedicated":"","position":"רכז בכיר-מרכז/ת בכיר (קידום תכנון ובקרה)","requirements":"השכלה: \n -------------------------------- \n השכלה אקדמית (תואר ראשון/שני): בגיאוגרפיה / באדריכלות / הנדסה \n אזרחית או בתכנון עירוני ואזורי. \n לאדריכלים ומהנדסים- רישום בפנקס המהנדסים והאדריכלים. \n *פירוט התארים השניים המוכרים בתחום תכנון ערים ואזורים אשר עומדים בדרישת \n ההשכלה במכרז מופיע למטה בהערות. \n לחילופין, הנדסאי: אדריכלות או בניין, \n להנדסאים- רישום בפנקס ההנד תית לבין הבחנה בפרטים. \n כושר ניהול וארגון. \n כושר הבעה בכתב ובעל פה בשפה העברית ברמה גבוהה. \n כושר קבלת החלטות. \n יחסי אנוש מעולים. \n דיסקרטיות. \n עצמאות. \n אסרטיביות. \n ידע וניסיון בסביבת עבודה ממוחשבת. \n הערות: \n ------ \n 1.(*)זכאות לתואר אקדמי המוכר ע\"י המועצה להשכלה גבוהה, לרבות אישור על \n שקילות לתואר זר, ממשרד החינוך. \n 2.(**)בהתאם להנחיית נציב שירות המדינה מס' 1.19 מיום ט\"ז בשבט התשפ\"ג (07 \n בפברואר 2023), בדבר מענה לעובדי מדינה ותיקים בהתמודדות במכרזים בדירוג \n המח\"ר, עובדי מדינה שאינם בעלי השכלה אקדמית יוכלו להתמודד במכרז פנימי או \n בינמשרדי למשרה זו, ככל ועומדים בתנאים המצטברים הבאים (סעיף 5.ג. להנחיה): \n 1. בעל/ת 12 שנות לימוד לפחות. \n 2. בעל/ת ותק של 20 שנה לפחות ברצף בשירות בעת הגשת המועמדות וכל עוד הנחיה \n זו בתוקף. \n 3. העובד/ת בעל/ת אופק שירות של לא יותר מחמש עשרה שנים עד מועד גיל פרישת \n חובה לגמלאות משירות המדינה על-פי חוק גיל פרישה, התשס\"ד-2004. \n 4. עובדים בעלי ניסיון מקצועי כמפורט מעלה, נדרשים למספר שנות ניסיון כפול \n מהנדרש לדרגה התחילית המקבילה בדרוג המנהלי במשרה זו, כמפורט בסעיף \n 11.131(ג) בתקש\"יר (טבלה: פנימי ובין-משרדי), בהתאם לפירוט הבא: \n א. למשרה במתח דרגות 36-38 בדירוג המח\"ר נדרשות 4 שנות ניסיון מקצועי \n ב. למשרה במתח דרגות 37-39 בדירוג המח\"ר נדרשות 6 שנות ניסיון מקצועי \n ג. למשרה במתח דרגות 38-40 בדירוג המח\"ר נדרשות 10 שנות ניסיון מקצועי \n ד. למשרה במתח דרגות 39-41 בדירוג המח\"ר נדרשות 12 שנות ניסיון מקצועי \n ה. למשרה במתח דרגות 40-42 בדירוג המח\"ר נדרשות 16 שנות ניסיון מקצועי \n 5. עמידה ביתר דרישות הסף של המשרה. \n 6. עובדים בעלי ציון 5 ומעלה בהערכת עובד בשנתיים מתוך שלוש השנים \n האחרונות. \n 7. עובדים שקיבלו המלצה לקידום בחוות דעת הממונה הישיר הנוכחי במסגרת הערכת \n העובדים. \n 3.(***)א. בהתאם לסעיף 39 לחוק ההנדסאים והטכנאים המוסמכים, התשע\"ג-2012, \n רשאים להגיש מועמדותם גם הנדסאים וטכנאים מוסמכים הרשומים בפנקס \n ההנדסאים/טכנאים, למשרות בדרוג אקדמאים, במדעי החברה והרוח בהם נקבעה דרישה \n להשכלה אקדמית כללית. הנדסאים וטכנאים מוסמכים ידרשו להציג ניסיון לפי \n הפירוט להלן: \n להנדסאים מוסמכים-4 שנות ניסיון כמפורט לעיל. לטכנאים מוסמכים-5 שנות \n ניסיון כמפורט לעיל. \n ב. בעל תעודת הנדסאי או טכנאי מוסמך אשר ייבחר למשרה ידורג בדירוג המנהלי. \n עובד/ת מתוך שירות המדינה אשר דורג/ה זה מכבר בדירוג ההנדסאים או הטכנאים \n רשאי לשמר את דירוגו המקצועי. \n ג. השלמת רישום בפנקס ההנדסאים והטכנאים עד 48 שעות טרם כינוס ועדת \n הבוחנים: \n יש להמציא אישור על רישום בפנקס ההנדסאים והטכנאים מטעם האגף לאסדרת \n עיסוקים במשרד העבודה עד 48 שעות טרם כינוס ועדת הבוחנים ככל שלא ימצא \n האישור כאמור תפסל המועמדות. \n מתוך כלל שנות הניסיון נדרש ניסיון מקצועי של שנתיים לפחות במשאבי אנוש.","unit":"הון אנושי יחידתי - נווה מנשה","ministry":"משרד הרווחה והביטחון החברתי","description":"סיוע למנהל/ת היחידה בתכנון עבודת משאבי אנוש, אדמיניסטרציה, התקשרויות, \n רכש, נכסים ולוגיסטיקה, בהתאם להנחיות הנהלת היחידה והמשרד ובתיאום עם \n יחידות המטה במשרד, ובכלל זה, אגף משאבי אנוש, אגף הדרכה, תחום רווחה, אגף \n רכש, נכסים ולוגיסטיקה, תחום מינהל ומשק במעונות, חשבות ועוד, בהתאם \n להוראות החוק, התקשי\"ר, נציבות שירות המדינה, התכ\"מ וכיוצ\"ב. \n  \n תיאור התפקיד: \n ------------ \n  \n משאבי אנוש: \n ********** \n אחריות על טיפול של המשאב האנושי ביחידה בטווח הקצר והארוך, ולשם השגת \n היעדים שלה, בהלימה לאסטרטגיית משאבי אנוש, במשרד. \n  \n אחריות על טיפול העובד לאורך כל חייו בארגון מקליטתו ועד עזיבתו, בתיאום \n מול אגף משאבי אנוש, במטה. \n  \n ייעוץ וליווי מנהלים בנושאים ארגוניים וניהול עובדים, אחריות על ניהול צוות \n עובדי משאבי אנוש ביחידה (ביחידות בהן יותר מעובד אחד). \n  \n גיוס, מיון וקידום ההליכים לאיוש משרות על פי החוק והתקש\"ר. \n  \n נוכחות ושכר, ובכלל זה, מעקב ובדיקת דוחות הנוכחות של העובדים, הקצאה \n ומיצוי של תנאי העסקה ותיאום מול יחידת המשכורת, במשרד. \n  \n הדרכה, ובכלל זה, תיאום עם אגף ההדרכה את השתתפותם של עובדי היחידה בקורסים \n ובתכניות הדרכה והשתתפותם בהשתלמויות וימי עיון של היחידה. \n  \n תחום רווחה העובדים: תיאום בין העובדים ליחידת המטה, על פי הצורך. \n  \n אחריות על הובלת תהליך הערכת עובדים לרבות אחריות על בניית מפת הערכה \n ארגונית. \n  \n רשומות ומידע: ניהול מאגר המסמכים והתיקיו חראי מרחבי)","publish_type":"מכרז פומבי","hot":false,"tender_number":"144155","job_number":"1","location":"ירושלים","pub_date":"2026-09-08","submission_deadline":"2026-10-06","percent":"100.00","dedicated":"","position":"מרכז/ת בכיר/ה (אחראי/ת מרחב)","requirements":"דרישות סף: \n ========== \n השכלה: \n -------- \n תואר אקדמי בהנדסה אזרחית. \n זכאות לתואר אקדמי המוכר ע\"י המועצה להשכלה גבוהה, \n לרבות אישור על שקילות לתואר זר ממשרד החינוך. \n רישום בפנקס מקצועי: \n ------------------- \n למהנדסים - רישום בפנקס המהנדסים והאדריכלים. \n נסיון: \n ------- \n תואר ראשון- 3 שנות ניסיון, \n תואר שני - 2 שנות ניסיון, \n ניסיון באחד או יותר מהתחומים הבאים: \n ניסיון בניהול פרויקטים בתחום הבנייה. \n ניסיון בבקרה ופיקוח אחר חברות מנהלות. \n נסיון בניהול צוות עובדים. \n הניסיון ימנה מיום קבלת התואר. \n הניסיון יכול להיות בחופף או במצטבר. \n כישורים ונתונים נוספים: \n *************** \n כושר לנהל משא ומתן מול גורמי חוץ ופנים. \n יחסי אנוש מעולים. \n הערה: \n ---- \n מסמך זה כתוב בלשון סתמית על פי כללי השפה העברית ופונה לנשים וגברים כאחד.","unit":"חטיבה טכנית","ministry":"משרד הבינוי והשיכון","description":"מעקב, בקרה ופיקוח על ביצוע פרוייקטי בנייה, תשתית ופיתוח, באחד ממרחבי \n המחוז, באמצעות צוות עובדים מקצועיים. \n  \n השתתפות בהליכי גיבוש הצעת הפרוגרמה המחוזית וריכוז נתונים לגבי המרחב, \n הצעת קדימויות ועדיפויות לביצוע העבודות וגיבוש הערכות לגבי עלויות ולוחות \n זמנים. \n  \n פיקוח באמצעות צוותי עובדים על ביצוע הפרוייקטים השונים במרחב. \n  \n השתתפות בסיורי קבלנים וסיוע לגורמי ההפעלה במידת הצורך. \n  \n מינוי כפיפים לפיקוח על העבודות באתר ואחריות להוצאת צו התחלת עבודה לקבלן \n המבצע ולמסירת השטח. \n  \n מעקב אחר הביצוע בכל שלביו וקיום פיקוח ישיר או עליון על העבודה המתבצעת, \n באמצעות המפקחים הכפיפים או באמצעות מנהלי פרוייקטים ומפקחים מחוזיים. \n  \n תיאום הביצוע עם המהנדסים המקצועיים במחוז ואחריות לשילובם במעקב ובפיקוח \n על עבודות הבנייה והפיתוח העל-קרקעיים והתת-קרקעיים (כולל מים, ביוב, \n ניקוז, חשמל, טלפון, תאורה, כבישים וכד'). \n  \n ניהול מגעים עם הרשות המקומית לחיבור התש  הומניטרית- יו\"ש)","publish_type":"מכרז פומבי","hot":false,"tender_number":"144158","job_number":"1","location":"תל אביב - יפו","pub_date":"2026-09-08","submission_deadline":"2026-10-06","percent":"100.00","dedicated":"","position":"עוזר ליועץ המשפטי","requirements":"דרישות סף \n ******** \n  \n רישיון ישראלי לעריכת דין וחברות בלשכת עורכי הדין, לרבות מי שחברותו \n מוגבלת בהתאם לסעיף 52ב לחוק לשכת עורכי הדין תשכ\"א-1961. מועמד שחברותו \n מוגבלת כאמור, יידרש להמציא אישור חברות בלשכת עורכי הדין (בתוקף) אם \n ייבחר לתפקיד, וכתנאי לשיבוצו במשרה. \n  \n ניסיון: \n --------- \n לדרגה תחילית לא נדרש ניסיון קודם בעבודה משפטית (למעט תקופת התמחות) \n  \n נתונים נוספים: \n ************* \n o ניסיון במתן יעוץ משפטי, כתיבת חוות דעת, ייצוג קידום חקיקה \n o ידיעת דינים הרלוונטיים לתחומי אחריותו של המשרד \n  \n כישורים: \n ******** \n - עצמאות מחשבתית \n - כושר עבודה בצוות ותקשורת בין-אישית טובה \n - כושר הבעה בכתב ובעל פה ברמה גבוהה מאד \n - יכולת ייצוג הופעה מול קהל \n - ידיעת השפה האנגלית כדי קריאת ספרות מקצועית \n  \n הערה: \n ******* \n אלו הם תחומי ההשכלה לתואר שני ו/או שלישי שלא במשפטים, המוכרים על ידי \n נציבות שירות המדינה כבעלי תרומה ממשית לביצוע תפקידו ולשיפור רמתו \n המקצועית של המשפטן או הפרקליט או הסנגור הציבורי, בהתאם לסעיף 6.1 להסכם \n הקיבוצי המיוחד מיום 4.12.2006: \n א. אשכול מנהל ציבורי: מנהל ציבורי, מדיניות ציבורית, ממשל ופוליטיקה, מדעי \n המדינה. \n ב. אשכול ניהול, ארגון ופיננסים: מנהל עסקים, כלכלה, חשבונאות, ניהול \n ארגונים, תעשייה וניהול, \n ניהול משאבי אנוש, ייעוץ ופיתוח ארגוני, גישור וניהול סכסוכים. \n ג. אשכול פלילי: קרימינולוגיה, תואר משולב עם התמחות במדעי פורנזיקה. \n ד. אשכול טכנולוגיות : מדעי המחשב, בינה מלאכותית, מדעי נתונים, מערכות \n מידע, אבטחת מידע, \n אבטחת סייבר. \n ה. אשכול אתיקה ופילוסופיה: אתיקה, ביו - אתיקה, פילוסופיה. \n  \n 2. מסמך זה כתוב בלשון סתמית על פי כללי השפה העברית ופונה לנשים וגברים \n כאחד.","unit":"לשכה משפטית","ministry":"רשות האוכלוסין וההגירה","description":"עיסוק בהיבטים המשפטיים של נושאים כלליים וייחודיים הנובעים מתחומי \n פעולותיו של המשרד /יחידת הסמך/ יחידה מינהלית (להלן \" המשרד\") במסגרת \n הלשכה לייעוץ משפטי. \n  \n  \n תיאור המטלות ותחומי האחריות: \n ============================ \n מתן ייעוץ משפטי והכנת חוות דעת בנושאים הרלוונטיים לתחום עיסוקו של המשרד. \n בדיקת פניות ושאלות בעלות אופי משפטי,ריכוז המידע הדרוש וניסוח את התשובות \n כנדרש. \n  \n הכנת כתבי תביעה והגנה וריכוז ההליכים הכרוכים בתביעות משפטיות המוגשות \n בידי ונגד המשרד. \n ליווי הדיון המשפטי,גיבוש עמדת המשרד בתיאום של קו התביעה או ההגנה הרצוי \n עם היועץ המשפטי ובתיאום עם הפרקליטות. \n  \n ייצוג המשרד בפני גופים שיפוטיים ומעין שיפוטיים על פי הסמכה \n והופעה בפני ועדות הכנסת, הממשלה, בתי משפט ובתי דין ורשויות אחרות. \n  \n סיוע בביצוע פעולות הכרוכות בחקיקה ובחקיקת משנה, בהכנת החומר הדרוש \n ובניסוח ההצעות לקראת העברתן לדיון בממשלה. \n  \n סיוע בניסוח נהלים, תדריכים משפטיים וכן מסמכים משפטיים שונים על פי הנחיות \n הממונים והדרכת עובדי המשרד לפי הצורך. \n  \n ליווי משפטי במו\"מ הנוגעים לביצוע פעולות עסקיות בתחום הרכש וקניית שירותים \n קבלניים, עריכת חוזים והתקשרויות וביצוע מעקב אחר יישום התחייבויות חוזיות \n שהמשרד או יחידת הסמך צד להן. \n  \n ביצוע פעולות נוספות על פי הנחיות של היועץ/ת המשפטי/ת של המשרד או של \n יחידת הסמך ובתיאום עם הממונה הישיר/ה.","rank":"ב-א3","cluster":"תפקידים בתחומים מנהלי ו/או חברתי/מילולי","category":"חוק ומשפט","request_id":"07685205","days_left":"4"},{"remarks":"1.\tמועמדים המצויים באחד או יותר מהמצבים הבאים יוגדרו  כזכאים ל \"מעמד מיוחד\": \n א.\tמועמדים בשירות מילואים (לרבות גיוס בצו 8) שזמינותם חלקית. \n ב.\tמועמדים שנקראו למילוי תפקיד בשעת חירום וזמינותם חלקית כדוגמת כוחות הביטחון, \n הרפואה, טיפול ורווחה. \n ג.\tמועמדים שהעתיקו את מקום מגוריהם כמפורט ברשימת הישובים המנויים בתוספת לחוק \n הגנה על עובדים בשעת חירום, תשס\"ו-2006 בשל המצב הביטחוני וזמינותם חלקית. \n ד.\tמועמדים אשר נמנים על ההגדרה של בן משפחה מדרגה ראשונה של חטוף או נעדר כמפורט \n בהנחיית נציב שירות המדינה והממונה על השכר מיום 9.11.23. \n 2.\tבמקרים חריגים של אי זמינות המועמד במהלך ימי הפרסום (כאמור ביחס למועמד  המוגדר \n 4"},{"remarks":"כל מקום בו מפורט תאור התפקיד בלשון זכר,הכוונה גם ללשון נקבה וכן להפך \n במשרה מועסק עובד \n גיליונות הערכה ומשוב של עובד המדינה יתקבלו כמסמכים דיגיטליים שיוצגו \n מתוך תיק העובד.עובד מדינה שתיק העובד אינו מנוהל במרכבה יצרף לבקשה \n גיליונות הערכה ומשוב מהשנתיים האחרונות. \n במידה שלא בוצעו הערכות עובד יש לצרף אישור על כך מאגף משאבי אנוש במשרד.","title":"רופא מומחה א.א.ג","publish_type":"מכרז פומבי","hot":false,"tender_number":"144110","job_number":"1","location":"נהריה","pub_date":"2026-09-07","submission_deadline":"2026-10-05","percent":"50.00","dedicated":"","position":"רופא/ה מומחה/ית","requirements":"דרישות סף \n ********************* \n רישיונות והשכלה: \n ---------------------- \n רישיון ישראלי לעסוק ברפואה בהתאם לקבוע בפקודת הרופאים (נוסח חדש), \n תשל\"ז-1976. \n מומחיות בתחום המחלקה/היחידה/המכון*, בהתאם לקבוע בתקנות הרופאים (אישור \n תואר מומחה ובחינות), תשל\"ג 1973. \n דרישות רצויות נוספות \n *********************** \n הכשרה: \n ------------------------ \n רצוי סיום השתלמות עמיתים (fellowship) במשרות בהן רלוונטי, בהתאם \n למומחיות הספציפית במשרה, כמפורט בתואר המשרה. \n שפות: \n ------------------------ \n ידיעת השפה העברית כדי ביטוי בכתב ובעל-פה ברמה גבוהה, וקריאת ספרות \n מקצועית. \n ידיעת שפה לועזית כדי קריאה וכתיבה של ספרות מקצועית המקובלת בארץ. \n כישורים אישיים: \n ------------------------ \n יכולת לקיים יחסי אנוש תקינים \n כושר ארגון וניהול \n יכולת לקיים בקרה ומעקב. \n שירותיות. \n הערות: \n ------------------- \n * בעת פרסום מכרז יש לציין את מקצוע היחידה בתואר המשרה. \n ** בעת פרסום מכרז חובה לציין את המומחיות הנדרשת הנגזרת מתחום היחידה*: \n בתחום האונקולוגיה - נדרשת מומחיות באונקולוגיה. \n בתחום האימונולוגיה והאלרגולוגיה- נדרשת מומחיות-על באימונולוגיה קלינית \n ואלרגולוגיה. \n בתחום האנדוקרינולוגיה-  נדרשת מומחיות-על באנדוקרינולוגיה. \n בתחום האנדוקרינולוגית ילדים - נדרשת מומחיות-על באנדוקרינולוגית ילדים. \n בתחום הגנטיקה -  נדרשת מומחיות-על בגנטיקה רפואית. \n בתחום הגסטרואנטרולוגיה - נדרשת מומחיות-על בגסטרואנטרולוגיה. \n בתחום הגסטרואנטרולוגית ילדים - נדרשת מומחיות-על בגסטרואנטרולוגית ילדים. \n בתחום הדימות והרנטגן - נדרשת מומחיות ברדיולוגיה אבחנתית. \n בתחום הגריאטריה - נדרשת מומחיות בגריאטריה או ברפואת משפחה או ברפואה \n פנימית. \n בתחום ההמטולוגיה - נדרשת מומחיות-על בהמטולוגיה. \n בתחום המטו-אונקולוגית ילדים - נדרשת מומחיות-על בהמטו-אונקולוגית ילדים. \n בתחום ההרדמה - נדרשת מומחיות בהרדמה. \n בתחום התפתחות הילד - נדרשת מומחיות-על בנוירולוגית ילדים והתפתחות הילד. \n בתחום הטיפול ביילוד -  נדרשת מומחיות-על בנאונטולוגיה. \n בתחום טיפול נמרץ ביילוד או בילדים - נדרשת מומחיות-על בטיפול נמרץ \n ילדים. \n בתחום הטיפולים הנמרצים - נדרשת מומחיות-על בטיפול נמרץ כללי. \n בתחום היילוד והגינקולוגיה - נדרשת מומחיות בילוד וגניקולוגיה. \n בתחום הריון בסיכון גבוהה- נדרשת מומחיות בילוד וגניקולוגיה. \n בתחום הילדים - נדרשת מומחיות ברפואת ילדים. \n בתחום הכאב - נדרשת מומחיות על ברפואה לשיכוך כאב, רשאים להגיש מועמדותם \n גם בעלי/ות מומחיות בהרדמה. עדיפות למומחיות בשיכוך כאב. \n בתחום הכירורגיה האורולוגית - נדרשת מומחיות בכירורגיה אורולוגית. \n בתחום הכירורגיה האורתופדית/טראומה אורתופדית –נדרשת מומחיות בכירורגיה \n אורתופדית. \n בתחום הטראומה- נדרשת מומחיות בכירורגיה כללית עם השתלמות עמיתים בטראומה. \n בתחום כירורגית כף רגל וקרסול – נדרשת מומחיות בכירורגיה אורתופדית. \n בתחום כירורגית מפרקים – נדרשת מומחיות בכירורגיה אורתופדית. \n בתחום כירורגית ילדים - נדרשת מומחיות-על בכירורגית ילדים. \n בתחום כירורגית כלי הדם - נדרשת מומחיות בכירורגית כלי דם. \n בתחום הכירורגיה הכללית - נדרשת מומחיות בכירורגיה כללית. \n בתחום הכירורגיה הקולורקטלית - נדרשת מומחיות בכירורגיה כללית עם השתלמות \n עמיתים בכירורגיה של הקולון והרקטום. \n בתחום הכירורגיה הכללית הלפרוסקופית- נדרשת מומחיות בכירורגיה כללית. \n בתחום כירורגית פה ולסת- נדרש רישיון ישראלי לעסוק ברפואת שיניים ומומחיות \n בכירורגיית פה ולסת. \n בתחום הכירורגיה הפלסטית - נדרשת מומחיות בכירורגיה פלסטית. \n בתחום הכירורגיה של בית החזה - נדרשת מומחיות בכירורגיה של בית החזה. \n בתחום הכירורגיה של היד - נדרשת מומחיות-על בכירורגיה של היד. \n בתחום כירורגית שד - נדרשת מומחיות בכירורגיה כללית. \n בתחום מחלות אף אוזן גרון וכירורגיית ראש וצוואר -  נדרשת  מומחיות במחלות \n אף אוזן גרון וכירורגיית ראש וצוואר. \n בתחום המחלות הזיהומיות - נדרשת מומחיות-על במחלות זיהומיות. \n והמתבגר. \n בתחום קרדיולוגית ילדים -  נדרשת מומחיות-על בקרדיולוגית ילדים. \n בתחום הרפואה הגרעינית/איזוטופים - נדרשת מומחיות ברפואה גרעינית. \n בתחום רפואת הפה ובתחום רפואת הפה בסיכון גבוה- נדרש רישיון ישראלי לעסוק \n ברפואת שיניים ומומחיות ברפואת הפה. \n בתחום רפואת הפה לילדים- נדרש רישיון ישראלי לעסוק ברפואת שיניים ומומחיות \n ברפואת שיניים לילדים. \n בתחום השיקום - נדרשת מומחיות ברפואה פיסיקלית ושיקום. \n מועמדותם רופאים בעלי מומחיות בכל אחד מתחומים אלה, ובלבד שלהם ניסיון \n בתחום מחלות ריאה - נדרשת מומחיות-על במחלות ריאה. \n בתחום מחלות ריאה ילדים - נדרשת מומחיות-על במחלות ריאה ילדים. \n בתחום מחלות ריאה ושחפת- נדרשת מומחיות על במחלות ריאה או מומחיות על \n במחלות זיהומיות או מומחיות ברפואה פנימית. \n בתחום הנוירוכירורגיה - נדרשת מומחיות בנוירוכירורגיה. \n בתחום הנוירולוגיה - נדרשת מומחיות בנוירולוגיה. \n בתחום נוירולוגית ילדים - נדרשת מומחיות-על בנוירולוגית ילדים והתפתחות \n הילד. \n בתחום הנפרולוגיה - נדרשת מומחיות-על בנפרולוגיה. \n בתחום נפרולוגית ילדים - נדרשת מומחיות-על בנפרולוגית ילדים. \n בתחום הפוריות - נדרשת מומחיות ביילוד וגניקולוגיה. \n בתחום הפסיכיאטריה - נדרשת מומחיות בפסיכיאטריה. \n בתחום פסיכיאטרית הילדים והנוער - נדרשת מומחיות בפסיכיאטריה של הילד \n בתחום הפרמקולוגיה - נדרשת מומחיות-על בפרמקולוגיה קלינית. \n בתחום הפתולוגיה - נדרש מומחיות באנטומיה פתולוגית. \n בתחום הקרדיולוגי/ לב - נדרשת מומחיות-על בקרדיולוגיה. \n בתחום הרפואה הדחופה - נדרשת מומחיות באחד ממקצועות הרפואה הקליניים, \n עדיפות למומחיות על ברפואה דחופה. \n ברפואה דחופה ילדים. \n בתחום הרפואה הדחופה לנשים - נדרשת מומחיות בילוד וגניקולוגיה. \n בתחום הרפואה הפנימית - נדרשת מומחיות ברפואה פנימית. \n *ביחידות שתחומי ההתמחות בהן משלבים למעלה מתחום מומחיות אחד, רשאים להגיש \n בתחום מחלות עור ומין - נדרש ת מומחיות במחלות עור ומין. \n בתחום מחלות עיניים - נדרשת מומחיות במחלות עיניים. \n בתחום מניעת זיהומים שאות הפעולה, \n לרבות  אינטובציה, החדרת ליינים והכנסת זונדה לקיבה. \n  \n השתתפות בצוות ההחייאה ובצוות טראומה, במידת הצורך ובהתאם להנחיות הממונה. \n  \n אחריות להדרכת והכשרת מתמחים, סטודנטים וסטאז'רים, לרבות ביצוע בקרה אחר \n בדיקות טרום ניתוחיות, תכניות הרדמה, תורנויות וכד'.","rank":"4-6","cluster":"","category":"בריאות","request_id":"07679243","days_left":"4"},{"remarks":"כל מקום בו מפורט תאור התפקיד בלשון זכר,הכוונה גם ללשון נקבה וכן להפך \n במשרה מועסק עובד \n גיליונות הערכה ומשוב של עובד המדינה יתקבלו כמסמכים דיגיטליים שיוצגו \n מתוך תיק העובד.עובד מדינה שתיק העובד אינו מנוהל במרכבה יצרף לבקשה \n גיליונות הערכה ומשוב מהשנתיים האחרונות. \n במידה שלא בוצעו הערכות עובד יש לצרף אישור על כך מאגף משאבי אנוש במשרד.","title":"רופא בכיר גסטרואנטרולוגיה","publish_type":"מכרז פומבי","hot":false,"tender_number":"144115","job_number":"1","location":"נהריה","pub_date":"2026-09-07","submission_deadline":"2026-10-05","percent":"50.00","dedicated":"","position":"רופא/ה מומחה/ית","requirements":"דרישות סף \n ********************* \n רישיונות והשכלה: \n ---------------------- \n רישיון ישראלי לעסוק ברפואה בהתאם לקבוע בפקודת הרופאים (נוסח חדש), \n תשל\"ז-1976. \n מומחיות בתחום המחלקה/היחידה/המכון*, בהתאם לקבוע בתקנות הרופאים (אישור \n תואר מומחה ובחינות), תשל\"ג 1973. \n דרישות רצויות נוספות \n *********************** \n הכשרה: \n ------------------------ \n רצוי סיום השתלמות עמיתים (fellowship) במשרות בהן רלוונטי, בהתאם \n למומחיות הספציפית במשרה, כמפורט בתואר המשרה. \n שפות: \n ------------------------ \n ידיעת השפה העברית כדי ביטוי בכתב ובעל-פה ברמה גבוהה, וקריאת ספרות \n מקצועית. \n ידיעת שפה לועזית כדי קריאה וכתיבה של ספרות מקצועית המקובלת בארץ. \n כישורים אישיים: \n ------------------------ \n יכולת לקיים יחסי אנוש תקינים \n כושר ארגון וניהול \n יכולת לקיים בקרה ומעקב. \n שירותיות. \n הערות: \n ------------------- \n * בעת פרסום מכרז יש לציין את מקצוע היחידה בתואר המשרה. \n ** בעת פרסום מכרז חובה לציין את המומחיות הנדרשת הנגזרת מתחום היחידה*: \n בתחום האונקולוגיה - נדרשת מומ n כושר לשקול ולשפוט במסגרת התפקיד. \n כושר להדריך ולפקח. \n עבודה עם מגזרים שונים: ממלכתי, חרדי, מגזר ערבי. \n יכולת ניהול מערכות חינוך חדשניות. \n יכולת בהובלת תהליכים פדגוגיים מערכתיים ויישומם בשדה. \n יכולת בפיתוח תוכניות ומודלים וביצירת מהלכים להטמעתם במערכת. \n כושר לקיים יחסי אנוש תקינים. \n כושר ניהול משא ומתן. \n ידיעת השפה העברית על בורייה. \n כושר ביטוי בכתב ובע\"פ. \n ידיעה טובה של שפה זרה נוספת, כדי קריאת ספרות מקצועית. \n התפקיד מחייב ניידות. רצוי בעל רכב ורשיון נהיגה בר תוקף. \n הערות כלליות \n ----------------- \n (*)זכאות לתואר אקדמי המוכר ע\"י המועצה להשכלה גבוהה, לרבות אישור על \n שקילות לתואר זר ממשרד החינוך. \n (**)השכלה פדגוגית מוכרת בארץ פירושה אחת מן האפשרויות: \n - תעודת מורה מוסמך/ת. \n - מוסמך/ת בכיר/ה ממוסד מוכר מהארץ להכשרת עובדי הוראה. \n - הסמכה על-סמך בחינות מילואים למורים. \n - בעל/ת רישיון הוראה קבוע לחינוך העל יסודי. \n - רישיון לעיסוק בהוראה. \n - תעודת הוראה אוניברסיטאית מהארץ. \n - תעודת גנן/ת מוסמך/ת. \n יתכנו שינויים במערך החינוך המיוחד אשר ישפיעו על המשרה האמורה ובכלל זה \n שינויה או ביטולה. \n \"מסמך זה כתוב בלשון סתמית על פי כללי השפה העברית ופונה לנשים וגברים \n כאחד\".","unit":"לשכת מחוז ירושלים - פיקוח","ministry":"משרד החינוך","description":"פועל מתוקף חוק חינוך מיוחד (תיקון  11), התשע\"ח 2018. \n  \n שותפות בהטמעה ויישום הרפורמה בחינוך הרגיל והמיוחד ברשויות המוגדרות, \n למטרת הכלה והשתלבות של תלמידים עם צרכים מיוחדים בחינוך הרגיל בהתאם \n לחוזרי מנכ\"ל ולמדיניות המשרד. \n  \n יישום והטמעת מטרות, יעדים ומדדים בנושא שילוב והכלת תלמידים עם צרכים \n מיוחדים במוסדות החינוך בתחום פיקוחו בשיתוף ותיאום המפקח הכולל והמפקח \n המתאם של החינוך המיוחד. \n  \n אחריות על פעילותן המקצועית של ועדות הזכאות והאפיון במרחב הגיאוגרפי \n המוגדר. \n אחריות על קבלת החלטות פדגוגיות מקצועיות לגבי זכאותם ואפיון רמת התפקוד \n והצרכים של תלמידים עם צרכים מיוחדים במסגרת החינוכית, בהתאמה לחוק החינוך \n המיוחד, לחוזר מנכ\"ל ובהתאם למסגרת התקציבית הנקבעת מדי שנה. \n  \n הובלה, הכוונה והנחיית חברי הצוות המשתתפים  בדיוני ועדת הזכאות והאפיון \n תוך שימת דגש על הצגת מידע רב-תחומי (פדגוגי, רפואי, פסיכולוגי, סוציאלי) \n אודות רמת תפקודו של התלמיד בממדים השונים, בהלימה לתפיסה, לחזקות ולקשיים \n המאפיינים את תחומי התפקוד השונים של התלמיד ושיתוף ההורים והתלמיד, הבנת \n רצונם ותפיסתם לגבי המענה הפדגוגי ההולם את צרכי התלמיד. \n  \n ייזום וניהול פדגוגי בדיונים בוועדת הזכאות ואפיון על-פי אמות מידה של \n אתיקה, אתיקה מקצועית וקיום דיון הוגן, המאפשר השתתפות משמעותית של \n כלל הנוכחים בדיון ושל ההורים בפרט. \n סיכום הדיון בקביעת החלטה באשר לעצם זכאותו של התלמיד לשירותי חינוך \n מיוחדים והיקף של השירותים לו הוא זכאי בהתאם למוגבלתו, צרכיו ולרמת \n תפקודו. \n  \n אחריות על היערכות מיטבית לדיוני הוועדה ועל גיבוש תכנית שיטתית וסדורה \n להתכנסותה בהסתמך על ניסיון, הכשרה ושיקול דעת מקצועי. \n סקירת המסמכים לקראת דיוני הוועדה ובמידת הצורך פנייה לקבלת מידע חיוני \n נוסף מהורי התלמיד, מהמנהל והצוות החינוכי במוסד, מבעלי תפקידים במשרד, \n במתי\"אות, ברשויות המקומיות, וכן מגורמים מטפלים. \n  \n ייזום המלצות ובחירת המענים המתאימים לצרכים של תלמידים הזכאים לשירותי \n החינוך המיוחד (כיתות, הסעות, מורים, סייעות, תכניות פדגוגיות, פרה רפואי) \n ברשות המוניציפאלית בה מתקיימות הוועדות וריכוז תמונת המצב. \n  \n קיום שיח לאורך שנת הלימודים וההיערכות לקראתה, עם גורמי הפיקוח במחוז. \n ניהול, מעקב ובקרה ווידוא מתן מענים הניתנים לתלמידים במוסדות חינוך \n כפי שנקבע בוועדת הזכאות לכל תלמיד שזכאותו אושרה על ידי הוועדה בראשות \n היו\"ר. \n מתן מענה לפניות ותלונות המתקבלות בנוגע לוועדות, התנהלותן וההחלטות \n המתקבלות בהן. \n  \n אחריות ליצירת קשרי עבודה שוטפים עם מנהלי מחלקות החינוך ברשויות בהן מכהן \n כיו\"ר ועדות זכאות. \n  \n מתן מענים והנמקות לעתירות מנהליות המוגשות לבית המשפט לגבי הוועדות ומסירת \n עדות בעת הצורך. \n אישור השתתפותם של הורים ותלמידים עם מוגבלויות בוועדות, ובמסגרת זאת מעקב \n אחר התאמות הנגשה רלוונטיות עבורם. \n  \n קיום שיח מקצועי ומכיל עם הורים ואפוטרופוסים לצורך זיהוי צרכים וסיוע \n בקבלת ההחלטה בבחירת מסגרת מתאימה וראויה לתלמידים עם צרכים מיוחדים. \n  \n דיווח שוטף לממונה במחוז על אופן התקדמות הוועדות וקבלת ההחלטות. \n אחריות על הקלדת הה ם ורישום בפנקס ההנדסאים/טכנאים. \n ניסיון וקורסים: \n ----------------------------- \n ניסיון באחד או יותר מתחומי הפעילות (לרבות ניסיון בניהול יחידת מערכות \n מידע ו/או בטכנולוגיות ופיתוח ו/או בתחום היישומים ו/או בתחום אבטחת מידע) \n ובהתאם למפורט בתואר המשרה, עפ\"י הפירוט הבא: \n לבעלי תואר שני  - 2 שנות ניסיון. \n לבעלי תואר ראשון - 3 שנות ניסיון. \n להנדסאים  - 4 שנות ניסיון. \n לטכנאים   - 5 שנות ניסיון. \n בתחום מערכות המידע: \n רצוי ניסיון בניהול מו\"מ ורכש בדגש על תחום מערכות המידע. \n קורסים בהיקף של 300 שעות לפחות בתחומי המחשוב הרלוונטיים לתחומי האחריות \n בתפקיד כגון: רשתות, תשתיות, אבטחת מידע, יישום והטמעת מערכות מידע, מנהלי \n מערכות מידע (CIO) או מוסמך קורס תכנות ממר\"מ. \n במכסת הקורסים יכללו גם קורסים בנושאים המפורטים, אשר נלמדו במסגרת \n הלימודים. \n בתחום טכנולוגיות ופיתוח: \n מתוך כלל שנות הניסיון נדרש ניסיון של שנתיים בניהול קבוצה טכנולוגית. \n קורס ניהול רשתות תקשורת בהיקף של 200 שעות לפחות. \n וקורס אחד לפחות מבין הקורסים הבאים, בהיקף כולל של 100 שעות לפחות: קורס \n מערכות הפעלה, קורס אבטחת מידע, קורס ניתוח מערכות או קורס מנהלי טכנולוגיה \n (CTO). \n בתחום היישומים: \n מתוך כלל שנות הניסיון נדרש ניסיון של שנתיים בניהול צוותי פיתוח ותחזוקת \n יישומים בתחום מערכות מידע. \n קורס ניתוח מערכות או קורס ניהול פרויקטים בהיקף של 200 שעות לפחות. \n המשך פירוט דרישות המשרה מופיע בהערות למכרז הרשומות מטה. \n בתחום אבטחת המידע: \n קורסים בהיקף של 200 שעות לימוד באחד או יותר מהתחומים הבאים: סייבר ו/או \n אבטחת מידע ו/או תשתיות ו/או ניתוח מערכות ו/או ניהול פרויקטים. \n חובה שאחד או יותר מהקורסים יהיה בתחום סייבר ו/או אבטחת מידע בהיקף של 100 \n שעות לימוד לפחות. \n ניתן למנות שנות ניסיון שנרכשו טרם קבלת התואר האקדמי ובלבד שהניסיון הוא \n בתחומי המטלות המופיעות בתיאור התפקיד או בתחומים שבהם יש זיקה למטלות אלה. \n דרישות נוספות ורצויות: \n *************************** \n ידע: \n --------------------------- \n היכרות עם תחום התקשוב הרפואי \n ידע וניסיון במערכות מחשוב מתקדמות. \n היכרות עם החוקים והנהלים הרלוונטיים. \n ניסיון מקצועי בהטמעת מערכות מידע ו/או תשתית תוכ <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = (s)=>document.querySelector(s);
const listEl=$('#list'), emptyEl=$('#empty'), countEl=$('#count');

// ---- populate filters ----
function uniq(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he'));}
function fill(id, values){
  const el=$(id);
  el.innerHTML='';
  const all=document.createElement('option'); all.value=''; all.textContent='הכל'; el.appendChild(all);
  values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; el.appendChild(o); });
}
fill('#cat', uniq(DATA.map(d=>d.category)));
fill('#min', uniq(DATA.map(d=>d.ministry)));
fill('#loc', uniq(DATA.map(d=>d.location)));
$('#total').textContent=DATA.length;

// ---- helpers ----
function esc(s){return (s==null?'':String(s));}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.ceil((d-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/86400000);
}
function deadlineInfo(d){
  const dls=daysUntil(d.submission_deadline);
  const date=d.submission_deadline||'—';
  if(dls===null) return {cls:'dl-closed', text:date};
  if(dls<0) return {cls:'dl-closed', text:date+' · פגה'};
  if(dls<=7) return {cls:'dl-bad', text:date+' · '+dls+' ימים'};
  if(dls<=30) return {cls:'dl-warn', text:date+' · '+dls+' ימים'};
  return {cls:'dl-ok', text:date+' · '+dls+' ימים'};
}

// ---- filtering + sorting ----
function current(){
  const q=$('#q').value.trim().toLowerCase();
  const cat=$('#cat').value, min=$('#min').value, loc=$('#loc').value;
  let out=DATA.filter(p=>{
    if(cat && p.category!==cat) return false;
    if(min && p.ministry!==min) return false;
    if(loc && p.location!==loc) return false;
    if(q){
      const hay=[p.position,p.title,p.ministry,p.unit,p.location,p.category,p.rank,p.tender_number,p.dedicated,p.publish_type].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const sort=$('#sort').value;
  const cmp={
    deadline_desc:(a,b)=>(b.submission_deadline||'').localeCompare(a.submission_deadline||''),
    deadline_asc:(a,b)=>(a.submission_deadline||'').localeCompare(b.submission_deadline||''),
    pub_desc:(a,b)=>(b.pub_date||'').localeCompare(a.pub_date||''),
    name:(a,b)=>(a.position||'').localeCompare(b.position||'','he'),
    ministry:(a,b)=>(a.ministry||'').localeCompare(b.ministry||'','he'),
  }[sort];
  out.sort(cmp);
  return out;
}

// ---- render list ----
function render(){
  const items=current();
  $('#shown').textContent=items.length;
  countEl.textContent = items.length ? ('מוצגות '+items.length+' משרות') : '';
  emptyEl.style.display = items.length? 'none':'block';
  listEl.innerHTML='';
  const frag=document.createDocumentFragment();
  items.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='row'; row.tabIndex=0;
    row.dataset.idx=i;
    const dl=deadlineInfo(p);
    row.innerHTML=
      '<div class="rtop">'+
        '<div class="rmain">'+
          '<p class="rtitle">'+esc(p.title||p.position||'')+'</p>'+
          '<p class="rpos">'+esc(p.position||'')+'</p>'+
          '<div class="rmeta">'+
            '<span class="badge gray">'+esc(p.ministry||'')+'</span>'+
            (p.location?'<span class="badge loc">'+esc(p.location)+'</span>':'')+
            (p.category?'<span class="badge">'+esc(p.category)+'</span>':'')+
            (p.rank?'<span class="badge gray">דרגה '+esc(p.rank)+'</span>':'')+
          '</div>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'+
          '<span class="deadline '+dl.cls+'">'+dl.text+'</span>'+
          '<span class="rnum">מכרז '+esc(p.tender_number||'')+'</span>'+
        '</div>'+
      '</div>';
    row.addEventListener('click',()=>openDetail(p,row));
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(p,row);}});
    frag.appendChild(row);
  });
  listEl.appendChild(frag);
  if(currentIdx!=null){
    const el=listEl.querySelector('[data-idx="'+currentIdx+'"]');
    if(el) el.classList.add('selected');
  }
}

// ---- detail ----
let currentIdx=null, currentPos=null;
function openDetail(p,row){
  currentIdx = row? row.dataset.idx : null;
  currentPos=p;
  listEl.querySelectorAll('.row.selected').forEach(r=>r.classList.remove('selected'));
  if(row) row.classList.add('selected');
  $('#d-title').textContent=p.title||p.position||'';
  const kv=[
    ['מכרז',p.tender_number],
    ['תפקיד',p.position],
    ['ארגון',p.ministry],
    ['אגף/יחידה',p.unit],
    ['מיקום',p.location],
    ['קטגוריה',p.category],
    ['דרגה',p.rank],
    ['מספר משרות',p.job_number],
    ['אחוז',p.percent],
    ['סוג',p.publish_type],
    ['תאריך פרסום',p.pub_date],
    ['מועד אחרון',p.submission_deadline],
    ['ID דרישה',p.request_id],
  ];
  $('#d-kv').innerHTML=kv.map(([k,v])=>'<dt>'+k+'</dt><dd>'+esc(v)+'</dd>').join('');
  const desc=(p.description||'').trim();
  $('#d-desc-wrap').style.display=desc?'':'none';
  $('#d-desc').textContent=desc||'—';
  $('#d-req').textContent=p.requirements||'—';
  $('#d-rem').textContent=p.remarks||'—';
  $('#d-open').onclick=()=>{
    if(p.request_id){
      window.open('https://merkava.mrp.gov.il/giusp/index.html#/position/'+p.request_id,'_blank','noopener');
    } else {
      window.open('https://merkava.mrp.gov.il/giusp/index.html','_blank','noopener');
    }
  };
  $('#detail').classList.add('on'); $('#detail').setAttribute('aria-hidden','false');
  $('#backdrop').classList.add('on');
}
function closeDetail(){
  $('#detail').classList.remove('on'); $('#detail').setAttribute('aria-hidden','true');
  $('#backdrop').classList.remove('on');
  listEl.querySelectorAll('.row.selected').forEach(r=>r.classList.remove('selected'));
  currentIdx=null;
}
function copyDetails(){
  if(!currentPos) return;
  const p=currentPos;
  const txt=['מכרז: '+p.tender_number,'תפקיד: '+(p.title||p.position),'ארגון: '+p.ministry,'אגף: '+(p.unit||''),
    'מיקום: '+p.location,'קטגוריה: '+p.category,'דרגה: '+(p.rank||''),'מועד אחרון: '+p.submission_deadline,'',
    'דרישות:',''+(p.requirements||''),'','הערות:',''+(p.remarks||'')].join('\n');
  navigator.clipboard.writeText(txt).then(()=>{
    const b=$('#d-copy'); const t=b.textContent; b.textContent='הועתק ✓'; setTimeout(()=>b.textContent=t,1200);
  }).catch(()=>{});
}

// ---- events ----
['#q','#cat','#min','#loc','#sort'].forEach(s=>$(s).addEventListener('input',render));
$('#clear').addEventListener('click',()=>{
  $('#q').value='';$('#cat').value='';$('#min').value='';$('#loc').value='';
  $('#sort').value='deadline_desc';
  render();
});
$('#d-close').addEventListener('click',closeDetail);
$('#backdrop').addEventListener('click',closeDetail);
$('#d-copy').addEventListener('click',copyDetails);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });

render();
</script>
</body>
</html>
