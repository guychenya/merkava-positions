name: Merkava — refresh & deploy

on:
  # Weekly automatic refresh — Mondays 06:00 UTC (≈09:00 Israel).
  # GitHub schedules run every few minutes at most and may be delayed by up to an hour.
  schedule:
    - cron: "0 6 * * 1"
  # Manual trigger from the Actions tab (used for testing / on-demand refresh).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape Merkava public positions
        run: python3 scrape.py

      - name: Build static site
        run: python3 build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
