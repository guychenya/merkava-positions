ארגון היציג של הסתדרות ההנדסאים \n והטכנאים,למשרות בדרוג המח\"ר בהן נקבעה דרישה להשכלה אקדמית כללית רשאים \n להגיש מועמדותם גם הנדסאים טכנאים מוסמכים. \n במקרה זה נדרשים הנדסאים וטכנאים לשנות ניסיון בתחומים המפורטים בעיסוק, \n כאמור בפסקה 11.131 בתקשי\"ר. \n הנדסאים וטכנאים ידרשו להציג ניסיון לפי הפירוט להלן: \n להנדסאים מוסמכים - 5 שנות ניסיון כמפורט לעיל. \n לטכנאים מוסמכים  - 6 שנות ניסיון  כמפורט לעיל. \n ב. בעל תעודת הנדסאי או טכנאי מוסמך אשר ייבחר למשרה ידורג בדירוג המנהלי. \n עובד/ת מתוך שירות המדינה אשר דורג/ה זה מכבר בדירוג ההנדסאים או הטכנאים \n רשאי לשמר את דרוגו המקצועי. \n ג. השלמת רישום בפנקס ההנדסאים והטכנאים עד 48 שעות טרם כינוס ועדת \n הבוחנים: \n יש להמציא אישור על רישום בפנקס ההנדסאים והטכנאים מטעם האגף לאסדרת \n עיסוקים במשרד העבודה \n עד 48 שעות טרם כינוס ועדת הבוחנים ככל שלא ימצא האישור כאמור תפסל \n המועמדות. \n 2.בהתאם להנחיית נציב שירות המדינה מס' 1.19 מיום 08.02.2023 \n בדבר מענה לעובדי מדינה ותיקים בהתמודדות במכרזים בדירוג המח\"ר, \n  עובדי מדינה שאינם בעלי השכלה אקדמית יוכלו להתמודד במכרז פנימי \n  או בינמשרדי למשרה זו, ככל ועומדים בתנאים המצטברים הבאים \n (סעיף 5.ג. להנחיה): \n 1.  בעל/ת 12 שנות לימוד לפחות. \n 2.  בעל/ת ותק של 20 שנה לפחות בשירות המדינה במועד פרסום \n  ההנחיה הנ\"ל (08.02.2023). \n 3.  העובד/ת בעל/ת אופק שירות של לא יותר מחמש עשרה שנה עד \n מועד הפרישה לגמלאות משירות המדינה. \n 4.  עובדים בעלי ניסיון מקצועי כמפורט מעלה, נדרשים למספר \n שנות ניסיון כפול מהנדרש לדרגה התחילית המקבילה בדרוג המינהלי \n  במשרה זו, כמפורט בתקשי\"ר בסעיף 11.131(ג) \n (טבלה: פנימי ובין-משרדי), בהתאם לפירוט הבא: \n  למשרה במתח דרגות 40-42 בדירוג המח\"ר נדרשות 16 שנות ניסיון מקצועי \n 5.  עמידה ביתר דרישות הסף של המשרה. \n 6.  עובדים בעלי ציון הערכת עובד מעל הממוצע המשרדי בשנתיים מתוך שלוש \n השנים האחרונות \n 7.  עובדים שקיבלו המלצה לקידום בחוות דעת הממונה הישיר הנוכחי במסגרת \n הערכת העובדים \n להלן נוסח ההנחיה המלא: www.gov.il/BlobFolder/policy/guide_line_ \n 119/he/guide_line_ \n *זכאות לתואר אקדמי המוכר ע\"י המועצה להשכלה גבוהה, לרבות אישור ע מית-תואר ראשון במשפטים \n רישיונות: \n --------- \n רישיון ישראלי לעריכת דין וחברות בלשכת עורכי הדין, לרבות מי שחברותו \n מוגבלת בהתאם לסעיף 52 ב לחוק לשכת עורכי הדין תשכ\"א 1961- . מועמד שחברותו \n מוגבלת כאמור, יידרש להמציא אישור חברות בלשכת עורכי הדין (בתוקף) אם \n ייבחר לתפקיד, וכתנאי לשיבוצו במשרה. \n ניסיון: \n ------- \n לדרגה תחילית לא נדרש ניסיון קודם בעבודה משפטית (למעט תקופת התמחות) \n נתונים נוספים רצויים : \n *************** \n ניסיון במתן יעוץ משפטי, כתיבת חוות דעת, ייצוג קידום חקיקה o \n ידיעת דינים הרלוונטיים לתחומי אחריותו של המשרד o \n כישורים: \n ******** \n - עצמאות מחשבתית \n - כושר עבודה בצוות ותקשורת בין-אישית טובה \n - כושר הבעה בכתב ובעל פה ברמה גבוהה מאד \n - יכולת ייצוג הופעה מול קהל \n - ידיעת השפה האנגלית כדי קריאת ספרות מקצועית \n הערה: \n ************ \n אלו הם תחומי ההשכלה לתואר שני ו/או שלישי שלא במשפטים, המוכרים על ידי \n נציבות שירות המדינה כבעלי תרומה ממשית לביצוע תפקידו ולשיפור רמתו \n המקצועית של המשפטן או הפרקליט או הסנגור הציבורי, בהתאם לסעיף 6.1 להסכם \n : הקיבוצי המיוחד מיום 4.12.2006 \n א. אשכול מנהל ציבורי: מנהל ציבורי, מדיניות ציבורית, ממשל ופוליטיקה, מדעי \n המדינה. \n ב. אשכול ניהול, ארגון ופיננסים: מנהל עסקים, כלכלה, חשבונאות, ניהול \n ארגונים, תעשייה וניהול, \n ניהול משאבי אנוש, ייעוץ ופיתוח ארגוני, גישור וניהול סכסוכים. \n ג. אשכול פלילי: קרימינולוגיה, תואר משולב עם התמחות במדעי פורנזיקה. \n ד. אשכול טכנולוגיות : מדעי המחשב, בינה מלאכותית, מדעי נתונים, מערכות \n מידע , אבטחת מידע, \n אבטחת סייבר. \n ה. אשכול אתיקה ופילוסופיה: אתיקה, ביו - אתיקה, פילוסופיה. \n מסמך זה כתוב בלשון סתמית על פי כללי השפה העברית ופונה לנשים וגברים כאחד.","remarks":"איוש המשרה כדרך קבע כפוף להתפנותה באופן סופי. \n **** \n כל מקום בו מפורט תאור התפקיד בלשון זכר,הכוונה גם ללשון נקבה וכן להפך \n מועמדים למשרה זו עשויים להיבחן במבחני כישורים כלליים והתנהגותיים. \n ראה/י הסברים והנחיות למועמדים שייבחנו . \n מועמדותך למכרז זה תאושר בכפוף להצהרתך כי הנך עומד/ת בתנאי הסף \n שנקבעו למכרז זה. פרטייך המלאים בצירוף המסמכים בפרופיל מועמדותך, \n יבדקו לא או שאחד מהוריו/ה נולדו באתיופיה, בני ובנות החברה החרדית \n ועולים/ות חדשים/ות. \n  \n 2. לצורך בחינת עמידתך בתנאי הסף לתכנית, ייבחנו הדברים הבאים: \n  (א) דרישת השכלה – יש לצרף קובץ סרוק של תעודות השכלה, זכאות לתואר \n      וגיליון ציונים חתומים על-ידי המוסד האקדמי. \n  \n  (ב) ראיון מצולם מקוון (א-סינכרוני) - הריאיון יתמקד בעשייה החברתית \n      שבחרת לקחת בה חלק, במניעים האישיים שלך להצטרפות לתכנית ובחיבור שלך \n      לערכים ולעקרונות שמובילים את תכנית צוערים לשירות המדינה, כדוגמת: \n  \n •(הישג חברתי)השפעה על מעגל חברתי/קהילתי. \n •(הישג מקצועי)השפעה או פעולה משמעותית במערכת ארגונית בעלת תוצאות \n  ברורות. \n * יש לצרף קורות חיים עדכניים. \n  \n 3. במכרז זה יופעל הליך סינון מקדים בכפוף לסעיף 12.14 לתקשי\"ר, אשר נועד \n לאתר את המועמדים בעלי פוטנציאל ההתאמה הגבוה ביותר לתכנית. במסגרת הליך \n זה,  תתבצע הערכה ע\"י היחידה המקצועית באשר למידת ההתאמה של המועמד לתכנית. \n ההערכה תתבסס על נתונים כגון: השכלה, ניסיון תעסוקתי, והמידע שיימסר \n בריאיון המצולם. \n  \n 4. מועמדותך למכרז זה תאושר בכפוף להצהרתך כי הנך עומד/ת בתנאי הסף שנקבעו \n למכרז זה. משכך, ניתן יהיה להשלים מסמכים המאמתים את השכלתך, ניסיונך \n המקצועי, קורסים ורישיונות לכל המאוחר על לתאריך 14/10/2026. \n לידיעתך, באחריותך לצרף את כלל המסמכים הנדרשים לשם הוכחת עמידתך בתנאי הסף \n עד לתאריך האמור, ולא תינתן התראה נוספת או אפשרות להשלמת מסמכים מעבר \n למועד זה. \n יובהר, כי אם יימצא במועד בדיקת המועמדויות כי לא צורפו כלל המסמכים \n הנדרשים, אנו נראה בך כמי שהסיר/ה מועמדות למכרז זה. כמו כן ביצוע ראיון \n מצולם א-סינכרוני הינה דרישת חובה לבחינת ההתאמה של המועמד לתכנית ולכן, \n אי-ביצוע הריאיון יוביל לסיום המועמדות במכרז. \n מועמדים למשרה זו יבצעו הליך מיון אישיותי-התנהגותי שיתקיים באופן פרונטלי. \n הסברים והנחיות יימסרו לקראת שלב זה. \n  \n 5. יש להפיק אישור שקילות עבור השכלה שנרכשה בחו\"ל. \n מרגע הקבלה לתכנית יועסקו הצוערים כעובדי מדינה במקביל לשלב ההכשרה \n וההתמחות ומנגד יתחייבו לעבוד בשירות המדינה במשך ארבע שנים לפחות מסיום \n תקופת ההתמחות. \n  \n 6. מחזור י\"ג של תכנית 'צוערים לשירות המדינה' צפוי להיפתח בח ------------------------- \n הכרת החוקים, התקנות והנהלים הקשורים לעבודה. \n שפות: \n -------------------------- \n ידיעת השפה העברית. \n ידיעת השפה האנגלית כדי קריאת מונחים מקצועיים. \n כישורים אישיים: \n -------------------------- \n כושר ניהול וארגון. \n תודעת שירות. \n יכולת גבוהה לעבודת צוות. \n תקשורת בינאישית ברמה גבוהה.","remarks":"כל מקום בו מפורט תאור התפקיד בלשון זכר,הכוונה גם ללשון נקבה וכן להפך \n במשרה מועסק עובד \n גיליונות הערכה ומשוב של עובד המדינה יתקבלו כמסמכים דיגיטליים שיוצגו \n מתוך תיק העובד.עובד מדינה שתיק העובד אינו מנוהל במרכבה יצרף לבקשה \n גיליונות הערכה ומשוב מהשנתיים האחרונות. \n במידה שלא בוצעו הערכות עובד יש לצרף אישור על כך מאגף משאבי אנוש במשרד. \n הערות: \n עדכון חלקיות משרה \n כל מקום בו מפורט תאור התפקיד בלשון זכר,הכוונה גם ללשון נקבה וכן להפך \n גיליונות הערכה ומשוב מהשנתיים האחרונות יתקבלו כמסמכים דיגיטליים שיוצגו \n מתוך תיק העובד.עובד שתיק העובד אינו מנוהל במרכבה יצרף לבקשה גיליונות \n הערכה ומשוב מהשנתיים האחרונות. \n במידה שלא בוצעו הערכות עובד יש לצרף אישור על כך מאגף משאבי אנוש במשרד. \n כל מקום בו מפורט תאור התפקיד בלשון זכר,הכוונה גם ללשון נקבה וכן להפך \n מועמדים למשרה זו עשויים להיבחן במבחני כישורים כלליים והתנהגותיים. \n ראה/י הסברים והנחיות למועמדים שייבחנו . \n גיליונות הערכה ומשוב של עובד המדינה יתקבלו כמסמכים דיגיטליים שיוצגו \n מתוך תיק העובד.עובד מדינה שתיק העובד אינו מנוהל במרכבה יצרף לבקשה \n גיליונות הערכה ומשוב מהשנתיים האחרונות. \n במידה שלא בוצעו הערכות עובד יש לצרף אישור על כך מאגף משאבי אנוש במשרד. \n עובדים המצויים באחד או יותר מהמצבים הבאים יוגדרו כזכאים ל \"מעמד מיוחד\": . \n א. עובדים בשירות מילואים (לרבות גיוס בצו 8) שזמינותם חלקית. \n ב. עובדים שנקראו למילוי תפקיד בשעת חירום וזמינותם חלקית כדוגמת כוחות \n הביטחון, הרפואה, טיפול ורווחה. \n ג. עובדים שהעתיקו את מקום מגוריהם כמפורט ברשימת הישובים המנויים בתוספת \n לחוק \n הגנה על עובדים בשעת חירום, תשס\"ו -2006 בשל המצב הביטחוני וזמינותם חלקית. \n ד. עובדים אשר נמנים על ההגדרה של בן משפחה מדרגה ראשונה של חטוף או נעדר \n כמפורט בהנחיית נציב שירות המדינה והממונה על השכר מיום . 9.11.23 \n 2 במקרים חריגים של אי זמינות המועמד במהלך ימי הפרסום (כאמור ביחס לעובד . \n המוגדר ב\"מעמד מיוחד\"), תבחן על ידי אגף בכיר גיוס ומיון האפשרות לקישור \n המועמדות \n לאחר תום מועד הרשמה ועד לכינוס ועדת הבוחנים, וזאת בכפוף להגשת אסמכתאות \n תומכות. \n 3 עובד שהוגדר ב\"מעמד מיוחד\" ונתקל בקושי בהגשת המועמדות ניתן להסתייע \n במשרד . \n המפרסם או באמצעות מרכז השירות למועמד, לרבות סיוע בהקמת פרופיל מועמדות \n בקישור \n הבא: (מערכת גיוס - פניה לנציג שירות). \n 4 ככלל באחריות המועמד להמציא את כלל המסמכים התומכים את עמידתו בדרישות \n הסף. . \n באופן חריג ועל מנת לסייע לעובדים ב\"מעמד מיוחד\", במכרזים פנימיים בלבד, \n תתאפשר \n השלמת מסמכים עד 48 שעות טרם כינוס ועדת הבוחנים. \n 5 משך ימי השלמת מסמכים לעובדים ב\"מעמד מיוחד\" יוגדר בהתאם לצורך ועד 14 \n ימי . \n השלמה (למען הסר ספק משך הארכת ימי השלמה תינתן באופן אחיד לכלל העובדים \n ב\"מעמד \n מיוחד\"). \n 6 בקביעת מועדי המיון וועדת הבוחנים, יילקחו בחשבון זמינות המועמדים ומכוני \n . \n המיון הונחו לפעול בהתאם. יובהר כי עד להשלמת הליכי המיון לעובדים ב\"מעמד \n מיוחד\" \n המכרז לא יועבר לכינוס ועדת בוחנים, וכן אין לכנס ועדת בוחנים במקרה שבו \n מועמד \n במילואים."},{"tender_number":"144413","position":"ממונה על הגנת הפרטיות","title":"ממונה על הגנת הפרטיות","ministry":"המשרד לבטחון לאומי","unit":"מינהל ומשאבי אנוש","location":"ירושלים","category":"שירות, פניות ציבור ומנהלה","rank":"40-42","job_number":"1","percent":"100.00","publish_type":"מכרז פומבי","pub_date":"2026-09-17","submission_deadline":"2026-10-12","req_start":"","req_end":"","dedicated":"","cluster":"תפקידים בתחומים מנהלי ו/או חברתי/מילולי","request_id":"07732122","hot":"","days_left":"4","requirements":"דרישות סף: \n ========== \n  \n השכלה: \n ----- \n השכלה אקדמית (תואר ראשון) \n יתרון לתואר במשפטים והסמכה לעריכת דין. \n  \n חובת קורסים: ממונים שייבחרו לתפקיד יחויבו להשלים הכשרה מקצועית בסיסית עד \n לתום שנת כהונתם הראשונה, במסגרת השתלמות תעודה לממוני הגנת הפרטיות או \n השתלמות תעודה בתחום הגנת המידע האישי, מטעם הרשות להגנת הפרטיות או \n בחסותה, בהיקף של לפחות 40 שעות. ממונה שלא ישלים את ההכשרה כאמור, לא יוכל \n להמשיך בתפקידו, אלא אם יתקבל לכך אישור בכתב מנציבות שירות המדינה, לאחר \n שתתקבל חוות דעת מהרשות להגנת הפרטיות למידע על הקורסים הזוכים כיום בחסות \n הרשות : \n https://www.gov.il/he/pages/dpo_course24 \n  \n ניסיון: \n ------ \n לבעלי תואר ראשון - 4 שנות ניסיון * \n לבעלי תואר שני - 3 שנות ניסיון* \n *ניסיון באחד או יותר מהתחומים הבאים: \n 1. הגנת הפרטיות/ הגנת מידע אישי \n 2. דיני הגנת הפרטיות/ דיני הגנת מידע אישי \n 2. ניהול היבטים משפטיים של שימוש בטכנולוגיות \n 4. ביקורת של מערכות מידע \n 5. תחומי הטכנולוגיה ואבטחת מידע. \n יובהר כי הניסיון יכול להיות מצטבר. \n  \n נתונים נוספים רצויים: \n -------------------- \n ניסיון מקצועי בתחומי הליבה של המשרד לביטחון לאומי \n ניסיון מקצועי כממונה הגנת הפרטיות בארגונים בינוניים או גדולים (DPO, CPO) \n בארץ או בחו\"ל \n השכלה אקדמית בטכנולוגיות מידע או ניהול מערכות מידע . \n הסמכה או הכשרה בידי ארגון בינלאומי בתחום רגולציית הגנת המידע האישי \n בעולם, או היכרות טובה עם רגולציית הגנת המידע האישי בשווקים בינלאומיים \n מובילים (אירופה, ארה\"ב או אחרים). \n הכשרה או הסמכה בתחום אבטחת המידע . \n ניסיון בתהליכי העבודה בארגונים במגזר הציבורי, וניסיון בהובלת תהליכים מול \n גורמים בכירים. \n ניסיון בגיבוש, כתיבה ויישום של תכניות עבודה ונהלים, לרבות הגדרת מטרות, \n הצבת יעדים ועמידה בהם . \n ניסיון בהטמעה וניהול של תהליכי ביקורת, כולל כתיבה וניתוח דוחות . \n ניסיון בניהול והדרכת צוות עובדים, יחס אנוש מעולים ויכולת עבודה בצוות . \n חריפות מחשבה, הבנה מהירה של תהליכים ויכולת גבוהה של עיבוד מידע מסוגים \n שונים וקבלת החלטות . \n כושר הבעה בכתב ובע\"פ ברמה גבוהה מאוד בשפה העברית והאנגלית עד כדי קריאת \n ספרות מקצועית . \n  \n הערות: \n ----- \n בהתאם לחוק ההנדסאים והטכנאים המוסמכים, התשע\"ג – 2012 , ובתיאום בין \n נציבות שירות המדינה לבין הארגון היציג של הסתדרות ההנדסאים והטכנאים, \n הנדסאי/ת או טכנאי/ת מוסמכ/ת, הרשומ/ה בפנקס ההנדסאים והטכנאים המוסמכים, \n רשאי/ת להתמודד במכרזים בדירוג האקדמאים בהם נקבעה דרישה להשכלה אקדמית \n כללית. במקרה זה הניסיון הנדרש מט   const dls=daysUntil(d.submission_deadline);
  const date=d.submission_deadline||'—';
  if(dls===null) return {cls:'dl-closed', text:date};
  if(dls<0) return {cls:'dl-closed', text:date+' · פגה'};
  if(dls<=7) return {cls:'dl-bad', text:date+' · '+dls+' ימים'};
  if(dls<=30) return {cls:'dl-warn', text:date+' · '+dls+' ימים'};
  return {cls:'dl-ok', text:date+' · '+dls+' ימים'};
}

// ---- filtering + sorting ----
function current(){
  const q=$('#q').value.trim().toLowerCase();
  const cat=$('#cat').value, min=$('#min').value, loc=$('#loc').value;
  let out=DATA.filter(p=>{
    if(cat && p.category!==cat) return false;
    if(min && p.ministry!==min) return false;
    if(loc && p.location!==loc) return false;
    if(q){
      const hay=[p.position,p.title,p.ministry,p.unit,p.location,p.category,p.rank,p.tender_number,p.dedicated,p.publish_type].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const sort=$('#sort').value;
  const cmp={
    deadline_desc:(a,b)=>(b.submission_deadline||'').localeCompare(a.submission_deadline||''),
    deadline_asc:(a,b)=>(a.submission_deadline||'').localeCompare(b.submission_deadline||''),
    pub_desc:(a,b)=>(b.pub_date||'').localeCompare(a.pub_date||''),
    name:(a,b)=>(a.position||'').localeCompare(b.position||'','he'),
    ministry:(a,b)=>(a.ministry||'').localeCompare(b.ministry||'','he'),
  }[sort];
  out.sort(cmp);
  return out;
}

// ---- render list ----
function render(){
  const items=current();
  $('#shown').textContent=items.length;
  countEl.textContent = items.length ? ('מוצגות '+items.length+' משרות') : '';
  emptyEl.style.display = items.length? 'none':'block';
  // rebuild
  listEl.innerHTML='';
  const frag=document.createDocumentFragment();
  items.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='row'; row.tabIndex=0;
    row.dataset.idx=i;
    const dl=deadlineInfo(p);
    row.innerHTML=
      '<div class="rtop">'+
        '<div class="rmain">'+
          '<p class="rtitle">'+esc(p.title||p.position||'')+'</p>'+
          '<p class="rpos">'+esc(p.position||'')+'</p>'+
          '<div class="rmeta">'+
            '<span class="badge gray">'+esc(p.ministry||'')+'</span>'+
            (p.location?'<span class="badge loc">'+esc(p.location)+'</span>':'')+
            (p.category?'<span class="badge">'+esc(p.category)+'</span>':'')+
            (p.rank?'<span class="badge gray">דרגה '+esc(p.rank)+'</span>':'')+
          '</div>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'+
          '<span class="deadline '+dl.cls+'">'+dl.text+'</span>'+
          '<span class="rnum">מכרז '+esc(p.tender_number||'')+'</span>'+
        '</div>'+
      '</div>';
    row.addEventListener('click',()=>openDetail(p,row));
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(p,row);}});
    frag.appendChild(row);
  });
  listEl.appendChild(frag);
  // keep selected highlight
  if(currentIdx!=null){
    const el=listEl.querySelector('[data-idx="'+currentIdx+'"]');
    if(el) el.classList.add('selected');
  }
}

// ---- detail ----
let currentIdx=null, currentPos=null;
function openDetail(p,row){
  currentIdx = row? row.dataset.idx : null;
  currentPos=p;
  listEl.querySelectorAll('.row.selected').forEach(r=>r.classList.remove('selected'));
  if(row) row.classList.add('selected');
  $('#d-title').textContent=p.title||p.position||'';
  const kv=[
    ['מכרז',p.tender_number],
    ['תפקיד',p.position],
    ['ארגון',p.ministry],
    ['אגף/יחידה',p.unit],
    ['מיקום',p.location],
    ['קטגוריה',p.category],
    ['דרגה',p.rank],
    ['מספר משרות',p.job_number],
    ['אחוז',p.percent],
    ['סוג',p.publish_type],
    ['תאריך פרסום',p.pub_date],
    ['מועד אחרון',p.submission_deadline],
    ['ID דרישה',p.request_id],
  ];
  $('#d-kv').innerHTML=kv.map(([k,v])=>'<dt>'+k+'</dt><dd>'+esc(v)+'</dd>').join('');
  $('#d-req').textContent=p.requirements||'—';
  $('#d-rem').textContent=p.remarks||'—';
  $('#detail').classList.add('on'); $('#detail').setAttribute('aria-hidden','false');
  $('#backdrop').classList.add('on');
}
function closeDetail(){
  $('#detail').classList.remove('on'); $('#detail').setAttribute('aria-hidden','true');
  $('#backdrop').classList.remove('on');
  listEl.querySelectorAll('.row.selected').forEach(r=>r.classList.remove('selected'));
  currentIdx=null;
}
function copyDetails(){
  if(!currentPos) return;
  const p=currentPos;
  const txt=['מכרז: '+p.tender_number,'תפקיד: '+(p.title||p.position),'ארגון: '+p.ministry,'אגף: '+(p.unit||''),
    'מיקום: '+p.location,'קטגוריה: '+p.category,'דרגה: '+(p.rank||''),'מועד אחרון: '+p.submission_deadline,'',
    'דרישות:',''+(p.requirements||''),'','הערות:',''+(p.remarks||'')].join('\n');
  navigator.clipboard.writeText(txt).then(()=>{
    const b=$('#d-copy'); const t=b.textContent; b.textContent='הועתק ✓'; setTimeout(()=>b.textContent=t,1200);
  }).catch(()=>{});
}

// ---- events ----
['#q','#cat','#min','#loc','#sort'].forEach(s=>$(s).addEventListener('input',render));
$('#clear').addEventListener('click',()=>{
  $('#q').value='';$('#cat').value='';$('#min').value='';$('#loc').value='';
  $('#sort').value='deadline_desc';
  render();
});
$('#d-close').addEventListener('click',closeDetail);
$('#backdrop').addEventListener('click',closeDetail);
$('#d-copy').addEventListener('click',copyDetails);
$('#d-open').addEventListener('click',()=>{
  // Merkava public portal search by tender number
  window.open('https://merkava.mrp.gov.il/','_blank','noopener');
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });

render();
</script>
